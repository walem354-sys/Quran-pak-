<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>القرآن الكريم — Al Quran-ul-Kareem</title>

<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Righteous&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#e9e9e9;
  color:#111;
  font-family:Arial,sans-serif;
  overflow-x:hidden;
}

button{
  border:0;
  cursor:pointer;
}

/* FIRST PAGE */

#homePage{
  position:fixed;
  inset:0;
  z-index:1000;
  background:
  radial-gradient(circle at center,#26391d,#10170d 70%);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.homePattern{
  position:absolute;
  inset:0;
  opacity:.18;
  background-image:
  repeating-radial-gradient(circle at 50% 50%,
  transparent 0,
  transparent 35px,
  #d5b44c 36px,
  transparent 38px);
}

.homeBox{
  position:relative;
  width:92%;
  max-width:520px;
  text-align:center;
  padding:35px 20px 45px;
  border:2px solid #d7b54a;
  border-radius:28px;
  background:rgba(20,35,15,.8);
  box-shadow:0 15px 45px rgba(0,0,0,.45);
}

.logoArabic{
  font-family:"Amiri",serif;
  font-size:82px;
  color:#e8bd3c;
  line-height:1.2;
  margin-bottom:15px;
}

.logoEnglish{
  direction:ltr;
  font-family:Arial,sans-serif;
  color:#f3b000;
  font-size:42px;
  font-weight:bold;
  letter-spacing:2px;
}

.logoSub{
  direction:ltr;
  color:white;
  font-size:31px;
  margin-top:3px;
  letter-spacing:2px;
}

.startBtn{
  margin-top:38px;
  padding:15px 55px;
  border-radius:40px;
  background:#f5a900;
  color:white;
  font-family:"Righteous",Arial,sans-serif;
  font-size:22px;
  box-shadow:0 5px 15px rgba(0,0,0,.3);
}

.startBtn:active{
  transform:scale(.96);
}

/* MAIN */

#mainPage{
  display:none;
  min-height:100vh;
}

.topStatus{
  height:55px;
  background:#263da3;
}

.header{
  height:138px;
  background:
  linear-gradient(rgba(20,45,20,.9),rgba(30,55,25,.95)),
  repeating-radial-gradient(circle,
  transparent 0,
  transparent 18px,
  rgba(190,170,80,.15) 20px);
  display:flex;
  align-items:center;
  padding:10px 20px;
  direction:ltr;
}

.headerLogo{
  width:190px;
  text-align:center;
}

.headerLogoArabic{
  font-family:"Amiri",serif;
  font-size:58px;
  color:#f0ae00;
  line-height:1;
}

.headerTitle{
  font-weight:bold;
  font-size:29px;
  color:#ffb000;
}

.headerSub{
  color:white;
  font-size:25px;
}

.searchBtn{
  margin-left:auto;
  width:65px;
  height:65px;
  border-radius:50%;
  background:#ffad00;
  color:white;
  font-size:35px;
}

.menuBtn{
  margin-left:25px;
  background:transparent;
  color:#ffad00;
  font-size:58px;
  line-height:1;
}

/* TABS */

.tabs{
  display:flex;
  direction:ltr;
  background:#eee;
  gap:0;
  overflow:hidden;
}

.tab{
  flex:1;
  min-width:0;
  height:99px;
  border-radius:50px;
  background:#ffad00;
  color:white;
  font-family:"Righteous",Arial,sans-serif;
  font-size:20px;
  margin:10px 0;
}

.tab.active{
  background:#087525;
}

/* SEARCH */

.searchArea{
  display:none;
  padding:12px;
  background:white;
}

.searchArea input{
  width:100%;
  padding:15px;
  border:2px solid #087525;
  border-radius:25px;
  font-size:17px;
  outline:none;
}

/* PARA PAGE */

#paraPage{
  padding:10px;
}

.paraCard{
  position:relative;
  min-height:158px;
  background:white;
  border-radius:20px;
  margin-bottom:18px;
  padding:25px 15px;
  display:flex;
  align-items:center;
  direction:ltr;
  box-shadow:0 2px 6px rgba(0,0,0,.15);
  overflow:hidden;
}

.paraArabic{
  position:absolute;
  right:70px;
  top:38px;
  font-family:"Amiri",serif;
  font-size:39px;
  direction:rtl;
  color:#111;
  white-space:nowrap;
}

.paraNo{
  position:absolute;
  right:0;
  bottom:0;
  width:60px;
  height:72px;
  background:#ffae00;
  color:white;
  border-radius:25px 0 0 0;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:"Righteous",Arial,sans-serif;
  font-size:24px;
}

.bookIcon{
  width:65px;
  font-size:54px;
  color:#43870b;
}

.audioBtn{
  width:58px;
  height:58px;
  border-radius:50%;
  background:#43870b;
  color:white;
  font-size:27px;
  margin-left:15px;
}

.pageNo{
  border:2px solid #111;
  border-radius:20px;
  padding:9px 13px;
  font-family:"Righteous",Arial,sans-serif;
  font-size:15px;
  white-space:nowrap;
  margin-left:25px;
}

.bookmarkBtn{
  position:absolute;
  left:15px;
  bottom:20px;
  background:transparent;
  font-size:28px;
  color:#43870b;
}

/* READING */

#readerPage{
  display:none;
  padding:10px;
}

.readerControls{
  display:flex;
  gap:8px;
  justify-content:center;
  margin-bottom:10px;
}

.readerControls button{
  background:#087525;
  color:white;
  padding:10px 18px;
  border-radius:20px;
}

.quranSheet{
  background:#fffdf4;
  min-height:75vh;
  border-radius:12px;
  padding:25px 15px;
  box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.surahTitle{
  text-align:center;
  font-family:"Amiri",serif;
  font-size:34px;
  color:#087525;
  margin-bottom:12px;
}

.bismillah{
  text-align:center;
  font-family:"Amiri",serif;
  font-size:34px;
  margin-bottom:20px;
}

.ayah{
  font-family:"Amiri",serif;
  font-size:27px;
  line-height:2.1;
  text-align:justify;
}

.ayahNum{
  color:#087525;
  font-size:20px;
}

.bottomNav{
  position:fixed;
  bottom:10px;
  left:10px;
  right:10px;
  height:58px;
  border-radius:35px;
  background:#ffad00;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:"Righteous",Arial,sans-serif;
  font-size:22px;
  box-shadow:0 4px 12px rgba(0,0,0,.25);
  z-index:500;
}

/* DARK */

.dark{
  background:#101410;
  color:white;
}

.dark .paraCard,
.dark .quranSheet{
  background:#1d241d;
  color:white;
}

.dark .paraArabic{
  color:white;
}

.dark .pageNo{
  border-color:white;
}

.dark .surahTitle{
  color:#e5c978;
}

@media(max-width:500px){

  .header{
    height:138px;
  }

  .headerLogo{
    width:175px;
  }

  .headerLogoArabic{
    font-size:45px;
  }

  .headerTitle{
    font-size:24px;
  }

  .headerSub{
    font-size:21px;
  }

  .menuBtn{
    margin-left:10px;
    font-size:45px;
  }

  .searchBtn{
    width:58px;
    height:58px;
    font-size:30px;
  }

  .tab{
    height:98px;
    font-size:17px;
  }

  .paraArabic{
    font-size:30px;
    right:45px;
  }

  .pageNo{
    font-size:13px;
    margin-left:15px;
  }

  .bookIcon{
    width:50px;
    font-size:43px;
  }

  .audioBtn{
    width:50px;
    height:50px;
  }
}
</style>
</head>

<body>

<!-- FIRST PAGE -->

<section id="homePage">

  <div class="homePattern"></div>

  <div class="homeBox">

    <div class="logoArabic">
      القرآن الكريم
    </div>

    <div class="logoEnglish">
      AL QURAN
    </div>

    <div class="logoSub">
      UL KAREEM
    </div>

    <button class="startBtn" onclick="openMain()">
      OPEN QURAN
    </button>

  </div>

</section>


<!-- MAIN PAGE -->

<section id="mainPage">

  <div class="topStatus"></div>

  <header class="header">

    <div class="headerLogo">

      <div class="headerLogoArabic">
        القرآن
      </div>

      <div class="headerTitle">
        AL QURAN
      </div>

      <div class="headerSub">
        UL KAREEM
      </div>

    </div>

    <button class="searchBtn" onclick="toggleSearch()">
      🔍
    </button>

    <button class="menuBtn" onclick="toggleDark()">
      ☰
    </button>

  </header>


  <div class="searchArea" id="searchArea">
    <input
      id="searchInput"
      type="text"
      placeholder="Quran me search karein..."
      oninput="searchQuran()"
    >
  </div>


  <div class="tabs">

    <button class="tab active" onclick="showPara()">
      Para
    </button>

    <button class="tab" onclick="showSurah()">
      Surah
    </button>

    <button class="tab" onclick="downloadQuran()">
      Download
    </button>

    <button class="tab" onclick="showBookmarks()">
      Bookmark
    </button>

  </div>


  <!-- PARA -->

  <div id="paraPage"></div>


  <!-- READER -->

  <div id="readerPage">

    <div class="readerControls">

      <button onclick="previousPage()">
        ◀
      </button>

      <button onclick="nextPage()">
        ▶
      </button>

      <button onclick="toggleDark()">
        🌙
      </button>

    </div>

    <div class="quranSheet">

      <div id="readerContent">
        Quran loading...
      </div>

    </div>

  </div>


  <div class="bottomNav">
    🕌 &nbsp; Donation
  </div>

</section>


<script>

let quranData = [];
let currentPage = 1;
let currentAudio = null;


/* OPEN FIRST PAGE */

function openMain(){

  document.getElementById("homePage").style.display="none";

  document.getElementById("mainPage").style.display="block";

  loadQuran();

}


/* LOAD QURAN */

async function loadQuran(){

  try{

    let response =
      await fetch(
        "https://api.alquran.cloud/v1/quran/quran-uthmani"
      );

    let data = await response.json();

    quranData = data.data.ayahs;

    createParaList();

  }catch(error){

    document.getElementById("paraPage").innerHTML =
      "<p style='text-align:center;padding:30px'>Quran load nahi ho saka.</p>";

  }

}


/* CREATE 30 PARA */

function createParaList(){

  let container =
    document.getElementById("paraPage");

  container.innerHTML="";

  let paraMap={};

  quranData.forEach(ayah=>{

    let juz=ayah.juz;

    if(!paraMap[juz]){
      paraMap[juz]=ayah;
    }

  });


  for(let i=1;i<=30;i++){

    let firstAyah=paraMap[i];

    if(!firstAyah) continue;

    let card=document.createElement("div");

    card.className="paraCard";


    let arabic=document.createElement("div");

    arabic.className="paraArabic";

    arabic.innerText=firstAyah.text;


    let book=document.createElement("div");

    book.className="bookIcon";

    book.innerHTML="📖";


    let audio=document.createElement("button");

    audio.className="audioBtn";

    audio.innerHTML="▶";

    audio.onclick=function(){

      playAyah(firstAyah);

    };


    let page=document.createElement("div");

    page.className="pageNo";

    page.innerText=
      "Page No : "+firstAyah.page;


    let bookmark=document.createElement("button");

    bookmark.className="bookmarkBtn";

    bookmark.innerHTML="🔖";

    bookmark.onclick=function(){

      saveBookmark(firstAyah);

    };


    let paraNo=document.createElement("div");

    paraNo.className="paraNo";

    paraNo.innerText=i;


    card.appendChild(book);

    card.appendChild(audio);

    card.appendChild(page);

    card.appendChild(arabic);

    card.appendChild(bookmark);

    card.appendChild(paraNo);


    card.onclick=function(e){

      if(
        e.target!==audio &&
        e.target!==bookmark
      ){

        openReader(firstAyah.page);

      }

    };


    container.appendChild(card);

  }

}


/* AUDIO */

function playAyah(ayah){

  if(currentAudio){
    currentAudio.pause();
  }

  let audio =
    new Audio(
      "https://cdn.islamic.network/quran/audio/128/ar.alafasy/"
      +ayah.number+".mp3"
    );

  currentAudio=audio;

  audio.play();

}


/* BOOKMARK */

function saveBookmark(ayah){

  localStorage.setItem(
    "quranBookmark",
    JSON.stringify(ayah)
  );

  alert("Bookmark save ho gaya");

}


/* SHOW BOOKMARK */

function showBookmarks(){

  let saved =
    localStorage.getItem("quranBookmark");

  if(!saved){

    alert("Abhi koi bookmark nahi hai");

    return;

  }

  let ayah=JSON.parse(saved);

  openReader(ayah.page);

}


/* READER */

function openReader(page){

  currentPage=page;

  document.getElementById("paraPage")
    .style.display="none";

  document.getElementById("readerPage")
    .style.display="block";

  renderPage();

}


function renderPage(){

  let ayahs=
    quranData.filter(
      a=>a.page===currentPage
    );

  let box=
    document.getElementById("readerContent");

  if(!ayahs.length){

    box.innerHTML="Page load nahi hui.";

    return;

  }

  let html="";

  let first=ayahs[0];

  html+=
    "<div class='surahTitle'>"+
    first.surah.name+
    "</div>";

  html+=
    "<div class='bismillah'>"+
    "بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ"+
    "</div>";


  ayahs.forEach(a=>{

    html+=
      "<span class='ayah'>"+
      a.text+
      " <span class='ayahNum'>"+
      "﴿"+a.numberInSurah+"﴾"+
      "</span> "+
      "</span>";

  });


  box.innerHTML=html;

}


function nextPage(){

  if(currentPage<604){

    currentPage++;

    renderPage();

  }

}


function previousPage(){

  if(currentPage>1){

    currentPage--;

    renderPage();

  }

}


/* SEARCH */

function toggleSearch(){

  let area=
    document.getElementById("searchArea");

  area.style.display=
    area.style.display==="block"
    ?"none"
    :"block";

}


function searchQuran(){

  let word=
    document.getElementById("searchInput")
    .value
    .trim();

  if(!word){

    createParaList();

    return;

  }

  let results=
    quranData.filter(
      a=>a.text.includes(word)
    );

  let container=
    document.getElementById("paraPage");

  container.innerHTML="";

  results.slice(0,100).forEach(a=>{

    let card=
      document.createElement("div");

    card.className="paraCard";

    card.innerHTML=
      "<div class='bookIcon'>📖</div>"+
      "<button class='audioBtn'>▶</button>"+
      "<div class='pageNo'>Page No : "+
      a.page+
      "</div>"+
      "<div class='paraArabic'>"+
      a.text+
      "</div>";

    card.onclick=
      ()=>openReader(a.page);

    let btn=
      card.querySelector(".audioBtn");

    btn.onclick=
      e=>{
        e.stopPropagation();
        playAyah(a);
      };

    container.appendChild(card);

  });

}


/* SURAH */

function showSurah(){

  let container=
    document.getElementById("paraPage");

  container.innerHTML="";

  let surahs=[];

  quranData.forEach(a=>{

    if(
      !surahs.find(
        s=>s.number===a.surah.number
      )
    ){

      surahs.push(a.surah);

    }

  });


  surahs.forEach(s=>{

    let card=
      document.createElement("div");

    card.className="paraCard";

    card.innerHTML=
      "<div class='bookIcon'>📖</div>"+
      "<div class='paraArabic'>"+
      s.name+
      "</div>"+
      "<div class='paraNo'>"+
      s.number+
      "</div>";

    card.onclick=function(){

      let ayah=
        quranData.find(
          a=>a.surah.number===s.number
        );

      openReader(ayah.page);

    };

    container.appendChild(card);

  });

}


/* DOWNLOAD */

function downloadQuran(){

  let text=
    quranData
    .map(
      a=>
      a.surah.name+
      " - "+
      a.numberInSurah+
      "\n"+
      a.text
    )
    .join("\n\n");

  let blob=
    new Blob(
      [text],
      {type:"text/plain;charset=utf-8"}
    );

  let url=
    URL.createObjectURL(blob);

  let a=
    document.createElement("a");

  a.href=url;

  a.download="Al-Quran-Ul-Kareem.txt";

  a.click();

  URL.revokeObjectURL(url);

}


/* PARA */

function showPara(){

  document.getElementById("readerPage")
    .style.display="none";

  document.getElementById("paraPage")
    .style.display="block";

  createParaList();

}


/* DARK MODE */

function toggleDark(){

  document.body.classList.toggle("dark");

  localStorage.setItem(
    "darkMode",
    document.body.classList.contains("dark")
  );

}


if(
  localStorage.getItem("darkMode")==="true"
){

  document.body.classList.add("dark");

}

</script>

</body>
</html>
