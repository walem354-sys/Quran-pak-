<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#075d37">
<title>القرآن الكريم — Al Quran-ul-Kareem</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
 --green:#075d37;--green2:#0b7a49;--gold:#c8a64b;--paper:#fffdf5;
 --ink:#183a2c;--muted:#6b756f;--shadow:0 10px 35px #0002;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#edf1ec;color:var(--ink)}
body{font-family:"Noto Naskh Arabic","Amiri",serif;overflow:hidden}
button,input,select{font:inherit}
button{cursor:pointer}
.app{height:100dvh;display:flex;flex-direction:column}
.topbar{
 height:62px;display:flex;align-items:center;justify-content:space-between;
 padding:8px 12px;background:linear-gradient(135deg,#064c2d,#0b7650);
 color:#fff;box-shadow:0 3px 15px #0003;z-index:5
}
.brand{font-family:Amiri,serif;font-size:23px;font-weight:700;line-height:1}
.brand small{display:block;font-family:Arial,sans-serif;font-size:9px;letter-spacing:1px;opacity:.8;text-align:center;margin-top:3px}
.actions{display:flex;gap:6px}
.iconbtn{
 width:42px;height:42px;border:1px solid #ffffff30;border-radius:13px;
 background:#ffffff15;color:#fff;font-size:20px
}
.iconbtn.active{background:#d9bd6650;color:#ffe7a0}
.viewer{flex:1;position:relative;display:flex;align-items:center;justify-content:center;padding:8px}
.book{
 width:min(680px,100%);height:min(100%,900px);position:relative;
 background:var(--paper);border:5px double var(--gold);border-radius:10px;
 box-shadow:var(--shadow);overflow:hidden
}
.book:before,.book:after{
 content:"";position:absolute;left:9px;right:9px;height:14px;border-top:2px solid var(--gold);
 border-bottom:1px solid #c8a64b66;pointer-events:none;z-index:2
}
.book:before{top:9px}.book:after{bottom:9px}
.page{
 position:absolute;inset:20px 15px 28px;display:flex;flex-direction:column;
 opacity:0;transform:translateX(25px);transition:.25s;pointer-events:none
}
.page.show{opacity:1;transform:none;pointer-events:auto}
.page-head{text-align:center;padding:5px 8px 2px}
.page-meta{display:flex;justify-content:space-between;color:#866d2d;font-size:13px}
.ornament{color:var(--gold);font-size:19px;letter-spacing:5px}
.surah-title{
 display:inline-block;margin:4px auto;padding:3px 28px;border:2px solid var(--gold);
 border-radius:25px;color:var(--green);font-size:22px;font-weight:700;
 background:#fffdf7
}
.bismillah{font-family:Amiri,serif;font-size:24px;color:var(--green);text-align:center;margin:2px 0}
.quran-text{
 flex:1;overflow:auto;text-align:justify;direction:rtl;padding:4px 8px 6px;
 scrollbar-width:thin;line-height:2.05
}
.ayah{display:inline}
.ayahnum{
 display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;
 width:25px;height:25px;border:1px solid var(--gold);border-radius:50%;
 color:var(--green);font-size:12px;margin:0 3px
}
.muqatta{font-size:34px!important;color:var(--green);font-weight:700}
.loading{text-align:center;padding:40px 10px;color:var(--muted);font-size:20px}
.bottom{
 height:62px;display:flex;align-items:center;justify-content:center;gap:8px;
 padding:7px 10px;background:#fff;border-top:1px solid #0001;z-index:5
}
.navbtn{
 width:48px;height:46px;border:1px solid #c8a64b80;border-radius:14px;background:#fff;
 color:var(--green);font-size:21px
}
.pagebox{display:flex;align-items:center;gap:6px}
.pageinput{width:70px;text-align:center;border:1px solid #c8a64b;border-radius:10px;padding:7px}
.total{color:#777;font-size:13px}
.drawer{
 position:fixed;z-index:20;inset:0;background:#0006;display:none
}
.drawer.open{display:block}
.panel{
 position:absolute;top:0;bottom:0;right:0;width:min(390px,92vw);background:#fff;
 padding:18px;box-shadow:-8px 0 30px #0004;overflow:auto
}
.panel h2{color:var(--green);margin-top:0}
.close{float:left;background:none;border:0;font-size:28px}
.field{margin:12px 0}
.field input,.field select{
 width:100%;padding:11px;border:1px solid #ccc;border-radius:12px;background:#fff
}
.bigbtn{
 width:100%;padding:12px;border:0;border-radius:13px;background:var(--green);color:#fff;margin:5px 0
}
.search-results{margin-top:10px}
.result{padding:10px;border-bottom:1px solid #ddd;cursor:pointer}
.result b{color:var(--green)}
.cover{
 position:absolute;inset:0;background:
 radial-gradient(circle at center,#ffffff00 0 35%,#075d3708 36% 100%),
 linear-gradient(135deg,#fffdf5,#f4eedc);
 display:flex;align-items:center;justify-content:center;text-align:center;z-index:10
}
.cover.hidden{display:none}
.coverbox{width:86%;padding:35px 15px;border:4px double var(--gold);border-radius:20px}
.coverbox .ayah{font-size:24px;color:var(--green)}
.coverbox h1{font-family:Amiri,serif;font-size:42px;color:var(--green);margin:22px 0 4px}
.coverbox h2{font-family:Arial,sans-serif;letter-spacing:2px;color:#80652a;font-size:18px}
.start{
 margin-top:25px;padding:13px 35px;border:0;border-radius:30px;
 background:linear-gradient(135deg,#075d37,#0b8a55);color:#fff;font-size:18px
}
.toast{
 position:fixed;left:50%;bottom:82px;transform:translateX(-50%);
 background:#183a2c;color:#fff;padding:9px 16px;border-radius:20px;
 opacity:0;pointer-events:none;transition:.25s;z-index:50
}
.toast.show{opacity:1}
.dark{--paper:#18211d;--ink:#f1eee1;--green:#d9bd66;--muted:#c4c4c4}
.dark body,.dark .bottom{background:#0d1511}
.dark .book,.dark .panel,.dark .field input,.dark .field select,.dark .navbtn{background:#18211d;color:#f1eee1}
.dark .surah-title{background:#18211d;color:#d9bd66}
.dark .ayahnum{color:#d9bd66}
.dark .bottom{border-color:#ffffff18}
@media(max-width:500px){
 .topbar{height:58px}.brand{font-size:20px}.iconbtn{width:39px;height:39px}
 .viewer{padding:4px}.book{border-width:4px}
 .page{inset:18px 10px 25px}.quran-text{font-size:22px;line-height:2}
 .surah-title{font-size:20px}.bismillah{font-size:22px}
}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
 <div class="brand">القرآن الكريم<small>AL QURAN-UL-KAREEM</small></div>
 <div class="actions">
  <button class="iconbtn" id="searchBtn" title="تلاش">⌕</button>
  <button class="iconbtn" id="bookmarkBtn" title="بک مارک">🔖</button>
  <button class="iconbtn" id="darkBtn" title="ڈارک موڈ">☾</button>
  <button class="iconbtn" id="menuBtn" title="مینو">☰</button>
 </div>
</header>

<main class="viewer">
 <section class="book" id="book">
  <div class="cover" id="cover">
   <div class="coverbox">
    <div class="ayah">لَا يَمَسُّهُ إِلَّا الْمُطَهَّرُونَ</div>
    <h1>القرآن الكريم</h1>
    <h2>AL QURAN-UL-KAREEM</h2>
    <div style="color:#80652a">اللہ کا مقدس کلام</div>
    <button class="start" id="startBtn">قرآن شروع کریں</button>
   </div>
  </div>
  <div class="page show" id="page">
   <div class="page-head">
    <div class="page-meta"><span id="juz">پارہ —</span><span id="pno">صفحہ 1 / 604</span></div>
    <div class="ornament">۞ ۞ ۞</div>
    <div id="surahTitle" class="surah-title">قرآن پاک</div>
    <div id="bismillah" class="bismillah"></div>
   </div>
   <div id="quranText" class="quran-text"><div class="loading">قرآن پاک لوڈ ہو رہا ہے...</div></div>
  </div>
 </section>
</main>

<footer class="bottom">
 <button class="navbtn" id="prev">→</button>
 <div class="pagebox">
  <input class="pageinput" id="pageInput" type="number" min="1" max="604" value="1">
  <span class="total">/ 604</span>
 </div>
 <button class="navbtn" id="next">←</button>
</footer>
</div>

<div class="drawer" id="drawer">
 <aside class="panel">
  <button class="close" id="close">×</button>
  <h2>قرآن پاک</h2>
  <div class="field">
   <label>صفحہ منتخب کریں</label>
   <input id="jump" type="number" min="1" max="604" placeholder="1 سے 604">
  </div>
  <button class="bigbtn" id="jumpBtn">صفحہ کھولیں</button>
  <button class="bigbtn" id="bookmarkOpen">محفوظ صفحہ کھولیں</button>
  <button class="bigbtn" id="downloadBtn">آف لائن صفحات محفوظ کریں</button>
  <div class="field">
   <label>سورت کے نام سے تلاش</label>
   <select id="surahSelect"><option>سورتیں لوڈ ہو رہی ہیں...</option></select>
  </div>
  <button class="bigbtn" id="surahBtn">سورت کھولیں</button>
  <p style="color:#777;font-size:13px">
   نوٹ: پہلی مرتبہ قرآن کا ڈیٹا انٹرنیٹ سے آئے گا۔ آف لائن بٹن صفحات کو فون کے کیش میں محفوظ کرتا ہے۔
  </p>
 </aside>
</div>

<div class="toast" id="toast"></div>

<script>
const API="https://api.alquran.cloud/v1";
const TOTAL=604;
let current=Number(localStorage.getItem("quranPage")||1);
let cache={};
let allSurahs=[];
const $=id=>document.getElementById(id);

function toast(t){
 $("toast").textContent=t;$("toast").classList.add("show");
 setTimeout(()=>$("toast").classList.remove("show"),2200);
}
function save(){localStorage.setItem("quranPage",current)}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

async function getPage(n){
 n=Math.max(1,Math.min(TOTAL,n));
 if(cache[n]) return cache[n];
 const local=localStorage.getItem("quran_page_"+n);
 if(local){try{return cache[n]=JSON.parse(local)}catch(e){}}
 const r=await fetch(`${API}/page/${n}/quran-uthmani`);
 if(!r.ok) throw new Error("API");
 const j=await r.json();
 cache[n]=j.data;
 try{localStorage.setItem("quran_page_"+n,JSON.stringify(j.data))}catch(e){}
 return j.data;
}

function pageFontSize(count){
 const w=innerWidth;
 if(w<420) return count>14?19:22;
 if(w<700) return count>14?21:24;
 return count>16?23:27;
}

async function renderPage(n){
 current=n;save();
 $("pno").textContent=`صفحہ ${n} / ${TOTAL}`;
 $("pageInput").value=n;
 $("quranText").innerHTML='<div class="loading">صفحہ لوڈ ہو رہا ہے...</div>';
 try{
  const data=await getPage(n);
  const first=data.ayahs?.[0];
  $("juz").textContent=first?`پارہ ${first.juz||"—"}`:"پارہ —";
  const groups=[];
  let last=-1;
  for(const a of data.ayahs||[]){
   if(a.surah.number!==last){
    groups.push({type:"surah",s:a.surah});
    last=a.surah.number;
   }
   groups.push({type:"ayah",a});
  }
  let html="";
  let firstOfSurah=true;
  for(const item of groups){
   if(item.type==="surah"){
    const s=item.s;
    html+=`<div style="text-align:center;margin:8px 0"><span class="surah-title">${escapeHTML(s.name)}</span></div>`;
    firstOfSurah=true;
    continue;
   }
   const a=item.a;
   let txt=escapeHTML(a.text);
   const isOpening=/^(الم|الر|المر|المص|كهيعص|طه|طسم|طس|يس|ص|حم|عسق|ق|ن)(\\s|$)/.test(a.text.trim());
   const cls=isOpening && a.numberInSurah===1?"muqatta":"";
   html+=`<span class="ayah ${cls}" data-ayah="${a.number}" data-surah="${a.surah.number}">${txt} <span class="ayahnum">${a.numberInSurah}</span></span> `;
  }
  $("quranText").innerHTML=html||'<div class="loading">اس صفحے پر متن دستیاب نہیں۔</div>';
  $("quranText").style.fontSize=pageFontSize((data.ayahs||[]).length)+"px";
  const s=first?.surah;
  $("surahTitle").textContent=s?s.name:"القرآن الكريم";
  $("bismillah").textContent="";
  window.scrollTo(0,0);
 }catch(e){
  $("quranText").innerHTML='<div class="loading">صفحہ لوڈ نہیں ہو سکا۔ انٹرنیٹ چیک کریں۔</div>';
 }
}

async function loadSurahs(){
 try{
  const r=await fetch(`${API}/surah`);
  const j=await r.json(); allSurahs=j.data||[];
  $("surahSelect").innerHTML=allSurahs.map(s=>`<option value="${s.number}">${s.number}. ${escapeHTML(s.name)} — ${escapeHTML(s.englishName)}</option>`).join("");
 }catch(e){
  $("surahSelect").innerHTML='<option>سورتیں دستیاب نہیں</option>';
 }
}

async function openSurah(num){
 const s=allSurahs.find(x=>x.number==num);
 if(!s)return;
 try{
  const r=await fetch(`${API}/surah/${num}/quran-uthmani`);
  const j=await r.json();
  const first=j.data?.ayahs?.[0];
  if(first?.page){closeDrawer();renderPage(first.page);toast(`${s.name} کھول دی گئی`)}
 }catch(e){toast("سورت کھولنے میں مسئلہ ہوا")}
}

function closeDrawer(){$("drawer").classList.remove("open")}
function openDrawer(){$("drawer").classList.add("open")}

$("startBtn").onclick=()=>{$("cover").classList.add("hidden");renderPage(current)}
$("next").onclick=()=>{if(current<TOTAL)renderPage(current+1)}
$("prev").onclick=()=>{if(current>1)renderPage(current-1)}
$("pageInput").onchange=e=>renderPage(Number(e.target.value)||1)
$("menuBtn").onclick=openDrawer
$("close").onclick=closeDrawer
$("drawer").onclick=e=>{if(e.target===$("drawer"))closeDrawer()}
$("jumpBtn").onclick=()=>{const n=Number($("jump").value);if(n>=1&&n<=604){closeDrawer();renderPage(n)}}
$("bookmarkBtn").onclick=()=>{
 localStorage.setItem("quranBookmark",current);toast(`صفحہ ${current} محفوظ ہو گیا`)
}
$("bookmarkOpen").onclick=()=>{
 const n=Number(localStorage.getItem("quranBookmark")||1);closeDrawer();renderPage(n)
}
$("darkBtn").onclick=()=>{
 document.documentElement.classList.toggle("dark");
 localStorage.setItem("quranDark",document.documentElement.classList.contains("dark")?"1":"0")
}
$("searchBtn").onclick=()=>{
 openDrawer();
 setTimeout(()=>toast("تلاش کا مکمل فیچر آف لائن ڈیٹا کے ساتھ اگلے مرحلے میں شامل کیا جا سکتا ہے"),100)
}
$("surahBtn").onclick=()=>openSurah(Number($("surahSelect").value))

$("downloadBtn").onclick=async()=>{
 if(!confirm("604 صفحات کو فون میں محفوظ کرنے کی کوشش کی جائے؟ اس کے لیے کافی انٹرنیٹ ڈیٹا درکار ہوگا۔"))return;
 closeDrawer();
 for(let n=1;n<=TOTAL;n++){
  try{await getPage(n)}
  catch(e){toast(`صفحہ ${n} پر رک گیا`);return}
  if(n%10===0) toast(`آف لائن محفوظ: ${n} / ${TOTAL}`);
 }
 toast("تمام صفحات محفوظ کرنے کی کوشش مکمل ہوگئی")
}

let sx=0,sy=0;
$("book").addEventListener("touchstart",e=>{sx=e.changedTouches[0].screenX;sy=e.changedTouches[0].screenY},{passive:true})
$("book").addEventListener("touchend",e=>{
 const dx=e.changedTouches[0].screenX-sx,dy=e.changedTouches[0].screenY-sy;
 if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)){
  if(dx<0 && current<TOTAL) renderPage(current+1);
  if(dx>0 && current>1) renderPage(current-1);
 }
},{passive:true})

if(localStorage.getItem("quranDark")==="1")document.documentElement.classList.add("dark");
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
loadSurahs();
renderPage(current);
</script>
</body>
</html>
