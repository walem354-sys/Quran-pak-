<html lang="ur" dir="rtl">

<title>📖 قرآن پاک — Al Quran-ul-Kareem</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{

  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#eee8d8;
}

body{
  font-family:"Noto Naskh Arabic","Amiri",serif;
  color:#222;
}

.app{
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* HEADER */
.header{
  height:58px;
  min-height:58px;
  background:#075b42;
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 10px;
  box-shadow:0 2px 8px #0004;
  z-index:20;
}

.title{
  font-size:21px;
  font-weight:bold;
}

.actions{
  display:flex;
  gap:5px;
}

.icon{
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:#ffffff18;
  color:white;
  font-size:19px;
}

/* SURAH SELECT */
.select-area{
  background:#f7f2e6;
  padding:7px 10px;
  border-bottom:1px solid #d7cdbb;
}

select{
  width:100%;
  height:40px;
  border:1px solid #b7a98d;
  border-radius:8px;
  background:white;
  padding:0 10px;
  font-size:16px;
  font-family:inherit;
}

/* BOOK AREA */
.book-wrap{
  flex:1;
  min-height:0;
  padding:8px;
  perspective:1400px;
}

.book{
  width:100%;
  height:100%;
  background:
    linear-gradient(90deg,#d7c9ad 0,#fdf9ed 5%,#fffdf6 50%,#fdf9ed 95%,#d7c9ad 100%);
  border-radius:5px;
  box-shadow:
    0 4px 16px #0004,
    inset 0 0 35px #7d6b4725;
  overflow-y:auto;
  overflow-x:hidden;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  padding:13px 13px 35px;
  touch-action:pan-y;
  transform-origin:center;
}

.book::-webkit-scrollbar{
  width:4px;
}

.book::-webkit-scrollbar-thumb{
  background:#a99772;
  border-radius:5px;
}

/* SURAH BOX */
.surah-box{
  border:2px solid #987c45;
  border-radius:12px;
  background:
    linear-gradient(135deg,#f8efd8,#fffdf5,#f2e5c5);
  margin:0 auto 14px;
  padding:9px 10px 12px;
  max-width:600px;
  text-align:center;
  box-shadow:
    0 3px 8px #0002,
    inset 0 0 18px #b9975220;
}

.surah-name{
  font-size:26px;
  font-weight:bold;
  color:#075b42;
  margin-bottom:2px;
}

.surah-info{
  font-size:14px;
  color:#624f2e;
  margin-bottom:6px;
}

.bismillah{
  font-size:27px;
  font-weight:bold;
  color:#111;
  line-height:1.9;
  border-top:1px solid #b89b62;
  padding-top:4px;
}

/* AYAT */
.ayah{
  direction:rtl;
  text-align:right;
  font-size:25px;
  line-height:2.15;
  padding:3px 2px;
  margin:0;
  color:#151515;
  word-spacing:2px;
}

.ayah-number{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:29px;
  height:29px;
  border:1px solid #967a45;
  border-radius:50%;
  font-size:14px;
  color:#705625;
  margin:0 5px;
  vertical-align:middle;
  flex-shrink:0;
}

/* AYAH AUDIO */
.ayah-tools{
  display:inline-flex;
  margin-right:4px;
}

.play-ayah{
  border:0;
  background:#075b42;
  color:white;
  width:27px;
  height:27px;
  border-radius:50%;
  font-size:13px;
}

/* PAGE TURN */
.turn-next{
  animation:turnNext .42s ease;
}

.turn-prev{
  animation:turnPrev .42s ease;
}

@keyframes turnNext{
  0%{transform:rotateY(0deg)}
  50%{transform:rotateY(-8deg);opacity:.75}
  100%{transform:rotateY(0deg);opacity:1}
}

@keyframes turnPrev{
  0%{transform:rotateY(0deg)}
  50%{transform:rotateY(8deg);opacity:.75}
  100%{transform:rotateY(0deg);opacity:1}
}

/* LOADING */
.loading{
  text-align:center;
  padding:45px 10px;
  color:#075b42;
  font-size:20px;
}

/* SEARCH */
.search-panel{
  position:fixed;
  top:58px;
  left:0;
  right:0;
  background:#fff;
  z-index:50;
  padding:10px;
  box-shadow:0 3px 12px #0004;
  display:none;
}

.search-row{
  display:flex;
  gap:6px;
}

.search-row input{
  flex:1;
  height:42px;
  border:1px solid #aaa;
  border-radius:8px;
  padding:0 10px;
  font-size:17px;
}

.search-row button{
  width:45px;
  border:0;
  border-radius:8px;
  background:#075b42;
  color:#fff;
  font-size:18px;
}

.results{
  max-height:55vh;
  overflow:auto;
  margin-top:8px;
}

.result{
  border-bottom:1px solid #ddd;
  padding:9px 4px;
  font-size:17px;
}

.result small{
  color:#075b42;
}

/* DARK */
.dark{
  background:#151515;
  color:#eee;
}

.dark .select-area{
  background:#202020;
  border-color:#444;
}

.dark select{
  background:#292929;
  color:white;
  border-color:#555;
}

.dark .book{

    linear-gradient(90deg,#29251e,#332e24 50%,#29251e);

.dark .ayah{

.dark .surah-box{

  border-color:#a98b50;

.dark .surah-info{
  color:#d6bd8a;
}

.dark .bismillah{
  color:#fff;
}

.dark .search-panel{
  background:#222;
  color:white;
}

/* ERROR */
.error{
  text-align:center;
  padding:30px 15px;
  color:#a40000;
  font-size:18px;
}

.retry{
  margin-top:10px;
  border:0;
  border-radius:8px;
  background:#075b42;
  color:white;
  padding:10px 18px;
  font-size:16px;
}
</style>
</head>

    <div class="actions">
      <button class="icon" onclick="openSearch()">🔎</button>

/* =========================
   LOAD PAGE
========================= */

async function loadPage(page, direction="next"){

  if(page < 1 || page > 604) return;

  book.innerHTML =
    `<div class="loading">قرآن پاک لوڈ ہو رہا ہے... انتظار کریں</div>`;

  try{

    const response = await fetch(
      API + "/page/" + page + "/quran-uthmani"
    );

    if(!response.ok){
      throw new Error("Network error");
    }

    const json = await response.json();

    if(!json.data || !json.data.ayahs){
      throw new Error("Quran data unavailable");
    }

    currentPage = page;
    currentAyahs = json.data.ayahs;

    renderPage(currentAyahs);

    book.classList.remove("turn-next","turn-prev");

    void book.offsetWidth;

    if(direction === "next"){
      book.classList.add("turn-next");
    }else{
      book.classList.add("turn-prev");
    }

  }catch(error){

    book.innerHTML = `
      <div class="error">
        قرآن پاک لوڈ نہیں ہو سکا۔
        <br>
        انٹرنیٹ چیک کریں۔
        <br>
        <button class="retry" onclick="loadPage(${page})">
          دوبارہ کوشش کریں
        </button>
      </div>
    `;
  }
}

/* =========================
   RENDER PAGE
========================= */

function renderPage(ayahs){

  book.innerHTML = "";

  let lastSurah = null;

  ayahs.forEach((ayah)=>{

    const surahNo = ayah.surah.number;

    /* نئی سورت */
    if(surahNo !== lastSurah){

      const s = surahs.find(x=>x[0] === surahNo);

      const box = document.createElement("div");
      box.className = "surah-box";

      const name = s ? s[1] : ayah.surah.name;

      const type = s
        ? s[2]
        : (ayah.surah.revelationType === "Meccan" ? "مکی" : "مدنی");

      const total = s
        ? s[3]
        : ayah.surah.numberOfAyahs;

      /*
        Bismillah:
        سورۃ التوبہ = نہیں
        باقی ہر سورت = صرف ایک
      */

      let bismillah = "";

      if(surahNo !== 9){

        bismillah = `
          <div class="bismillah">
            بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِیْمِ
          </div>
        `;
      }

      box.innerHTML = `
        <div class="surah-name">
          سورۃ ${escapeHTML(name)}
        </div>

        <div class="surah-info">
          ${type} &nbsp; • &nbsp;
          ${total} آیات
          &nbsp; • &nbsp;
          رکوع: —
        </div>

        ${bismillah}
      `;

      book.appendChild(box);

      lastSurah = surahNo;
    }

    /*
      IMPORTANT:
      Bismillah یہاں شامل نہیں کی جا رہی۔
      API کا ayah.text اپنی اصل آیت ہے۔
      اس لیے الم اپنی مکمل آیت رہے گی۔
    */

    const ayahDiv = document.createElement("div");
    ayahDiv.className = "ayah";

    const number = ayah.numberInSurah;

    const text = ayah.text || "";

    ayahDiv.innerHTML = `
      ${escapeHTML(text)}
      <span class="ayah-number">${number}</span>
      <span class="ayah-tools">
        <button
          class="play-ayah"
          onclick='playAyah(${JSON.stringify(ayah.audio || "")})'>
          ▶
        </button>
      </span>
    `;

    book.appendChild(ayahDiv);

  });

  book.scrollTop = 0;
}

/* =========================
   SAFE TEXT
========================= */

function escapeHTML(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

/* =========================
   SWIPE PAGE
========================= */

book.addEventListener("touchstart",(e)=>{

  if(!e.touches.length) return;

  startX = e.touches[0].clientX;
  startY = e.touches[0].clientY;

},{passive:true});


book.addEventListener("touchend",(e)=>{

  if(!e.changedTouches.length) return;

  const endX = e.changedTouches[0].clientX;
  const endY = e.changedTouches[0].clientY;

  const dx = endX - startX;
  const dy = endY - startY;

  /*
    اگر swipe زیادہ horizontal ہو
    تب page change ہوگا۔
  */

  if(Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy)){

    if(dx < 0){

      /* left swipe = next page */
      loadPage(currentPage + 1,"next");

    }else{

      /* right swipe = previous page */
      loadPage(currentPage - 1,"prev");
    }
  }

},{passive:true});

/* =========================
   SEARCH
========================= */

function openSearch(){

  document.getElementById("searchPanel").style.display="block";

  setTimeout(()=>{
    document.getElementById("searchInput").focus();
  },100);
}

function closeSearch(){

  document.getElementById("searchPanel").style.display="none";
}

async function searchQuran(){

  const word =
    document.getElementById("searchInput").value.trim();

  const results =
    document.getElementById("results");

  if(!word) return;

  results.innerHTML =
    `<div class="loading">تلاش جاری ہے...</div>`;

  try{

    const url =
      API +
      "/search/" +
      encodeURIComponent(word) +
      "/all/quran-uthmani";

    const response = await fetch(url);

    const json = await response.json();

    results.innerHTML = "";

    if(
      !json.data ||
      !json.data.matches ||
      json.data.matches.length === 0
    ){

      results.innerHTML =
        "<div class='result'>کوئی نتیجہ نہیں ملا۔</div>";

      return;
    }

    json.data.matches.forEach(item=>{

      const div = document.createElement("div");

      div.className="result";

      div.innerHTML = `
        <small>
          سورۃ ${escapeHTML(item.surah.name)}
          — آیت ${item.numberInSurah}
        </small>
        <br>
        ${escapeHTML(item.text)}
      `;

      results.appendChild(div);
    });

  }catch(e){

    results.innerHTML =
      "<div class='result'>تلاش میں مسئلہ آیا۔</div>";
  }
}

/* =========================
   AUDIO
========================= */

function playAyah(url){

  if(!url) return;

  audioPlayer.pause();

  audioPlayer.src = url;

  audioPlayer.play().catch(()=>{});
}

function playPage(){

  if(!currentAyahs.length) return;

  audioList =
    currentAyahs
      .map(a=>a.audio)
      .filter(Boolean);

  audioIndex = 0;

  playNextAudio();
}

function playNextAudio(){

  if(audioIndex >= audioList.length){

    audioPlayer.pause();

    return;
  }

  audioPlayer.src =
    audioList[audioIndex];

  audioPlayer.play().catch(()=>{});

  audioPlayer.onended = ()=>{

    audioIndex++;

    playNextAudio();
  };
}

function toggleDark(){

  document.body.classList.toggle("dark");

  localStorage.setItem(
    "quranDark",
    document.body.classList.contains("dark")
  );
}

if(localStorage.getItem("quranDark")==="true"){

  document.body.classList.add("dark");
}
