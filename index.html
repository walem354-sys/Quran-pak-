<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>القرآن الكريم — Al Quran Ul Kareem</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet">

<style>

/* =========================================================
   BASIC
========================================================= */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{
    background:
        radial-gradient(circle at top,#176b4c 0,#064b35 38%,#033a29 100%);
    color:#173d2d;
    font-family:"Noto Naskh Arabic","Amiri",serif;
    transition:.3s;
}

button,
select,
input{
    font-family:inherit;
}

/* =========================================================
   HEADER
========================================================= */

.header{
    min-height:82px;
    padding:9px 15px 7px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;

    background:
        linear-gradient(135deg,
        #07583c 0%,
        #0b6b48 45%,
        #06472f 100%);

    border-bottom:3px solid #d7b65b;
    box-shadow:
        0 3px 15px rgba(0,0,0,.35),
        inset 0 -1px 0 #fff5bd;

    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    width:58px;
    height:58px;
    border:2px solid #d9b85b;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#f3d875;
    font-size:34px;
    background:
        radial-gradient(circle,#0b6040,#06452f);
    box-shadow:
        inset 0 0 0 3px rgba(255,255,255,.08),
        0 2px 7px rgba(0,0,0,.3);
}

.headerTitle{
    text-align:center;
    flex:1;
    min-width:0;
}

.headerTitle h1{
    margin:0;
    color:#f4d77b;
    font-size:27px;
    line-height:1.05;
    font-weight:700;
}

.headerTitle div{
    color:#fff;
    font-family:Arial,sans-serif;
    font-size:13px;
    letter-spacing:2px;
    margin-top:4px;
}

.headerButtons{
    display:flex;
    gap:7px;
}

.iconBtn{
    width:42px;
    height:42px;
    border-radius:50%;
    border:1px solid #ffe39a;
    background:
        linear-gradient(#f6c747,#eaa91d);
    color:#fff;
    font-size:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 2px 5px rgba(0,0,0,.25);
    cursor:pointer;
}

.iconBtn:active{
    transform:scale(.93);
}

/* =========================================================
   CONTROL AREA
========================================================= */

.controls{
    padding:10px;
    background:#07553a;
    border-bottom:1px solid #c9a84f;
    display:none;
}

.controls.show{
    display:block;
}

.controlRow{
    display:flex;
    gap:7px;
    margin-bottom:7px;
}

.controlRow:last-child{
    margin-bottom:0;
}

.searchBox,
.surahSelect{
    width:100%;
    height:43px;
    border-radius:22px;
    border:2px solid #d6b75e;
    background:#fffdf0;
    color:#174c35;
    outline:none;
    padding:0 15px;
    font-size:15px;
}

.searchBtn{
    min-width:50px;
    height:43px;
    border-radius:22px;
    border:2px solid #d6b75e;
    background:#eebd39;
    color:white;
    font-size:20px;
}

/* =========================================================
   MAIN
========================================================= */

.main{
    max-width:760px;
    margin:auto;
    padding:14px 8px 30px;
}

/* =========================================================
   LOADING
========================================================= */

.loading{
    min-height:55vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:#ffe49b;
    text-align:center;
}

.spinner{
    width:52px;
    height:52px;
    border:5px solid rgba(255,255,255,.2);
    border-top-color:#f0ca5b;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin-bottom:15px;
}

@keyframes spin{
    to{transform:rotate(360deg);}
}

.loadingText{
    font-size:19px;
}

/* =========================================================
   BOOK
========================================================= */

.book{
    width:100%;
    position:relative;
    perspective:1200px;
}

.page{
    position:relative;
    width:100%;
    min-height:900px;

    padding:17px 15px 14px;

    background:
        radial-gradient(circle at 50% 50%,
        rgba(255,255,255,.55),
        transparent 55%),
        linear-gradient(135deg,
        #fff6cf 0%,
        #f8e9ad 45%,
        #fff4c8 100%);

    border:6px double #bd9b43;

    box-shadow:
        0 8px 25px rgba(0,0,0,.35),
        inset 0 0 0 2px #fff7c8,
        inset 0 0 0 7px #0c6344,
        inset 0 0 0 10px #d5b557;

    overflow:hidden;
}

/* Ornamental corners */

.page::before,
.page::after{
    content:"";
    position:absolute;
    pointer-events:none;
    z-index:0;
}

.page::before{
    inset:5px;
    border:2px solid #0a5a3c;
}

.page::after{
    inset:11px;
    border:1px solid #c5a34c;
}

/* =========================================================
   PAGE TOP
========================================================= */

.pageTop{
    position:relative;
    z-index:2;

    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:7px;

    margin:2px 3px 9px;
}

.topBox{
    min-width:80px;
    padding:3px 10px;

    text-align:center;

    color:#174b35;
    background:#fff8d9;

    border:1px solid #c39f45;
    border-radius:14px;

    font-size:12px;
    font-weight:bold;

    box-shadow:
        inset 0 0 0 1px #fff,
        0 1px 2px rgba(0,0,0,.15);
}

.pageNumber{
    background:#09603f;
    color:#f6d77b;
    border:2px solid #d8b85c;
    min-width:60px;
}

/* =========================================================
   SURAH HEADER
========================================================= */

.surahHeader{
    position:relative;
    z-index:2;

    margin:7px auto 10px;
    max-width:95%;

    min-height:54px;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;

    padding:7px 14px;

    background:
        linear-gradient(90deg,
        #07593b,
        #0a7049,
        #07593b);

    color:#f9dc82;

    border:2px solid #c9a64e;
    border-radius:8px;

    box-shadow:
        inset 0 0 0 2px rgba(255,255,255,.12),
        0 2px 5px rgba(0,0,0,.25);
}

.surahNumber{
    min-width:32px;
    height:32px;

    display:flex;
    justify-content:center;
    align-items:center;

    border-radius:50%;
    background:#e1bc54;
    color:#075337;

    font-family:Arial,sans-serif;
    font-size:14px;
    font-weight:bold;
}

.surahArabic{
    font-family:"Amiri","Noto Naskh Arabic",serif;
    font-size:29px;
    font-weight:bold;
}

.surahEnglish{
    position:absolute;
    left:10px;
    font-family:Arial,sans-serif;
    font-size:8px;
    color:#e7d18b;
    direction:ltr;
}

/* =========================================================
   BISMILLAH
========================================================= */

.bismillah{
    position:relative;
    z-index:2;

    width:82%;
    margin:5px auto 11px;

    text-align:center;

    padding:5px 8px;

    color:#144e36;

    background:
        linear-gradient(#fffbe9,#f8e9b6);

    border:1px solid #b7943e;
    border-radius:22px;

    font-family:"Amiri","Noto Naskh Arabic",serif;
    font-size:24px;
    font-weight:bold;

    box-shadow:
        inset 0 0 0 1px #fff,
        0 2px 4px rgba(0,0,0,.12);
}

/* =========================================================
   QURAN TEXT
========================================================= */

.quranText{
    position:relative;
    z-index:2;

    padding:7px 9px 10px;

    text-align:justify;

    color:#172f25;

    font-family:"Amiri","Noto Naskh Arabic",serif;

    font-size:24px;
    font-weight:400;

    line-height:2.25;

    direction:rtl;
}

.ayah{
    display:inline;
}

.ayahText{
    cursor:pointer;
}

.ayahText:active{
    background:rgba(204,169,71,.18);
    border-radius:5px;
}

.ayahNumber{
    display:inline-flex;

    width:28px;
    height:28px;

    margin:0 4px;

    align-items:center;
    justify-content:center;

    vertical-align:middle;

    border:1px solid #ae8d3e;
    border-radius:50%;

    color:#15543b;
    background:
        radial-gradient(circle,#fff6c9,#e6c866);

    font-family:"Amiri",serif;
    font-size:14px;
    font-weight:bold;
}

/* Opening letters */

.opening{
    font-size:39px !important;
    font-weight:bold;
    color:#075c3b;
    line-height:1;
}

/* =========================================================
   PAGE BOTTOM
========================================================= */

.pageBottom{
    position:relative;
    z-index:2;

    margin-top:10px;

    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:7px;
}

.bottomBox{
    flex:1;

    min-height:34px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:1px solid #bb9941;
    border-radius:17px;

    background:#fff7d7;
    color:#155139;

    font-size:12px;
    font-weight:bold;
}

.bottomCenter{
    flex:1.5;

    background:
        linear-gradient(#086344,#075339);

    color:#f5d87c;

    border:2px solid #caa84e;
}

/* =========================================================
   NAVIGATION
========================================================= */

.navigation{
    position:relative;
    z-index:5;

    margin-top:9px;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;

    padding:6px;

    background:
        linear-gradient(90deg,
        #07563a,
        #0a6845,
        #07563a);

    border:2px solid #c7a64e;
    border-radius:10px;

    box-shadow:
        0 3px 7px rgba(0,0,0,.3);
}

.navBtn{
    width:45px;
    height:35px;

    border:0;
    border-radius:18px;

    background:transparent;
    color:#f3d37b;

    font-size:27px;

    cursor:pointer;
}

.navBtn:active{
    transform:scale(.9);
}

.navCenter{
    flex:1;

    height:35px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#f4d47b;

    font-size:14px;
    font-weight:bold;

    background:#07583b;
    border:1px solid #c6a44a;
    border-radius:18px;
}

/* =========================================================
   COVER
========================================================= */

.cover{
    min-height:900px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;
}

.coverInner{
    position:relative;
    z-index:2;

    width:90%;
    padding:30px 18px;

    border:4px double #c9a74d;
    border-radius:12px;

    background:
        radial-gradient(circle at center,
        #fff4c7 0,
        #f4dda0 55%,
        #e5c875 100%);

    box-shadow:
        inset 0 0 0 5px #0a6241,
        inset 0 0 0 8px #d1af51,
        0 7px 20px rgba(0,0,0,.25);
}

.coverOrnament{
    width:180px;
    height:180px;

    margin:15px auto 20px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:5px solid #c7a348;

    background:
        radial-gradient(circle,
        #0a6945 0,
        #07543a 60%,
        #053d2c 100%);

    color:#f0cf6b;

    clip-path:polygon(
        50% 0%,
        61% 14%,
        76% 9%,
        83% 24%,
        97% 25%,
        91% 40%,
        100% 50%,
        91% 61%,
        97% 76%,
        83% 77%,
        76% 92%,
        61% 86%,
        50% 100%,
        39% 86%,
        24% 92%,
        17% 77%,
        3% 76%,
        9% 61%,
        0% 50%,
        9% 40%,
        3% 25%,
        17% 24%,
        24% 9%,
        39% 14%
    );

    font-size:60px;
    font-family:"Amiri",serif;
}

.coverTitle{
    color:#07563a;
    font-family:"Amiri",serif;
    font-size:36px;
    font-weight:bold;
}

.coverEnglish{
    color:#37634f;
    font-family:Arial,sans-serif;
    font-size:15px;
    letter-spacing:2px;
    direction:ltr;
}

.startBtn{
    margin-top:25px;

    min-width:180px;
    padding:10px 24px;

    border:2px solid #d2b052;
    border-radius:25px;

    background:
        linear-gradient(#0a7049,#075238);

    color:#f7d77d;

    font-size:18px;
    font-weight:bold;

    box-shadow:0 3px 8px rgba(0,0,0,.25);
}

.startBtn:active{
    transform:scale(.96);
}

/* =========================================================
   ERROR
========================================================= */

.errorBox{
    margin:35px 10px;
    padding:25px;

    text-align:center;

    color:#8a2525;

    background:#fff0f0;

    border:2px solid #c95b5b;
    border-radius:12px;

    font-family:Arial,sans-serif;
}

/* =========================================================
   SEARCH RESULTS
========================================================= */

.searchResults{
    display:none;
    position:relative;
    z-index:20;

    margin:10px 0;

    max-height:60vh;
    overflow:auto;

    background:#fff8dc;

    border:2px solid #c5a34d;
    border-radius:10px;
}

.searchResults.show{
    display:block;
}

.result{
    padding:11px;
    border-bottom:1px solid #d8c27d;
    cursor:pointer;
}

.result:last-child{
    border-bottom:0;
}

.resultTitle{
    color:#07573a;
    font-weight:bold;
}

.resultText{
    color:#222;
    font-family:"Amiri",serif;
    line-height:1.8;
}

/* =========================================================
   DARK MODE
========================================================= */

body.dark{
    background:#071c15;
}

body.dark .controls{
    background:#062f22;
}

body.dark .page{
    background:
        linear-gradient(135deg,#eee1a9,#d9ca8d,#eee1ad);
}

body.dark .quranText{
    color:#161d19;
}

body.dark .searchResults{
    background:#efe2ae;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:600px){

    .header{
        min-height:72px;
        padding:7px 8px;
    }

    .logo{
        width:47px;
        height:47px;
        font-size:27px;
    }

    .headerTitle h1{
        font-size:21px;
    }

    .headerTitle div{
        font-size:9px;
        letter-spacing:1px;
    }

    .headerButtons{
        gap:4px;
    }

    .iconBtn{
        width:36px;
        height:36px;
        font-size:18px;
    }

    .main{
        padding:8px 4px 20px;
    }

    .page{
        min-height:calc(100vh - 105px);
        padding:12px 9px 10px;
        border-width:5px;
    }

    .topBox{
        min-width:60px;
        font-size:10px;
        padding:3px 6px;
    }

    .surahHeader{
        min-height:47px;
        padding:5px 8px;
    }

    .surahArabic{
        font-size:24px;
    }

    .surahEnglish{
        display:none;
    }

    .bismillah{
        width:94%;
        font-size:20px;
        padding:4px;
    }

    .quranText{
        font-size:21px;
        line-height:2.12;
        padding:5px 3px;
    }

    .ayahNumber{
        width:24px;
        height:24px;
        font-size:12px;
        margin:0 2px;
    }

    .opening{
        font-size:33px !important;
    }

    .cover{
        min-height:calc(100vh - 120px);
    }

    .coverOrnament{
        width:145px;
        height:145px;
        font-size:48px;
    }

    .coverTitle{
        font-size:30px;
    }
}

</style>
</head>


<body>

<!-- =========================================================
     HEADER
========================================================= -->

<header class="header">

    <div class="logo">ﷲ</div>

    <div class="headerTitle">
        <h1>القرآن الكريم</h1>
        <div>AL QURAN UL KAREEM</div>
    </div>

    <div class="headerButtons">

        <button
            class="iconBtn"
            onclick="toggleControls()"
            title="Search">
            🔍
        </button>

        <button
            class="iconBtn"
            onclick="bookmarkPage()"
            title="Bookmark">
            🔖
        </button>

        <button
            class="iconBtn"
            onclick="toggleDark()"
            title="Dark Mode">
            ☰
        </button>

    </div>

</header>


<!-- =========================================================
     CONTROLS
========================================================= -->

<section class="controls" id="controls">

    <div class="controlRow">

        <input
            id="searchInput"
            class="searchBox"
            type="search"
            placeholder="قرآن پاک میں لفظ تلاش کریں..."
            autocomplete="off">

        <button
            class="searchBtn"
            onclick="searchQuran()">
            🔍
        </button>

    </div>

    <div class="controlRow">

        <select
            id="surahSelect"
            class="surahSelect"
            onchange="selectSurah(this.value)">

            <option value="">سورت منتخب کریں</option>

        </select>

    </div>

    <div
        id="searchResults"
        class="searchResults">
    </div>

</section>


<!-- =========================================================
     MAIN
========================================================= -->

<main class="main">

    <div id="app">

        <div class="loading">

            <div class="spinner"></div>

            <div class="loadingText">
                قرآن پاک لوڈ ہو رہا ہے...
            </div>

        </div>

    </div>

</main>


<script>

/* =========================================================
   API
========================================================= */

const QURAN_API =
    "https://api.alquran.cloud/v1/quran/quran-uthmani";


/* =========================================================
   GLOBAL DATA
========================================================= */

let allAyahs = [];
let pageData = {};
let surahs = [];

let currentPage = 0;

const TOTAL_PAGES = 604;

const BISMILLAH =
    "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ";


/* =========================================================
   START
========================================================= */

document.addEventListener("DOMContentLoaded", () => {

    loadQuran();

    document
        .getElementById("searchInput")
        .addEventListener("keydown", function(e){

            if(e.key === "Enter"){
                searchQuran();
            }

        });

});


/* =========================================================
   LOAD FULL QURAN
========================================================= */

async function loadQuran(){

    try{

        showLoading("قرآن پاک کا مکمل متن لوڈ ہو رہا ہے...");

        const response =
            await fetch(QURAN_API, {
                cache:"no-store"
            });

        if(!response.ok){
            throw new Error(
                "Quran API HTTP Error: " +
                response.status
            );
        }

        const json = await response.json();

        if(
            !json ||
            !json.data ||
            !Array.isArray(json.data.ayahs)
        ){

            throw new Error(
                "قرآن کا ڈیٹا درست شکل میں نہیں ملا۔"
            );
        }

        allAyahs = json.data.ayahs;

        if(allAyahs.length < 6000){

            throw new Error(
                "قرآن کا مکمل متن لوڈ نہیں ہوا۔"
            );
        }


        /* ---------------------------------------------
           Create 604 pages
        --------------------------------------------- */

        pageData = {};

        for(let i=1; i<=TOTAL_PAGES; i++){
            pageData[i] = [];
        }


        allAyahs.forEach(ayah => {

            const page = Number(ayah.page);

            if(
                page >= 1 &&
                page <= TOTAL_PAGES
            ){

                pageData[page].push(ayah);

            }

        });


        /* ---------------------------------------------
           Surah list
        --------------------------------------------- */

        const map = new Map();

        allAyahs.forEach(ayah => {

            if(
                ayah.surah &&
                ayah.surah.number &&
                !map.has(ayah.surah.number)
            ){

                map.set(
                    ayah.surah.number,
                    ayah.surah
                );

            }

        });

        surahs =
            Array.from(map.values())
            .sort((a,b) =>
                a.number - b.number
            );


        createSurahList();


        /* ---------------------------------------------
           Open cover
        --------------------------------------------- */

        renderCover();

    }
    catch(error){

        console.error(error);

        showError(
            "قرآن پاک لوڈ نہیں ہو سکا۔",
            error.message
        );

    }

}


/* =========================================================
   LOADING
========================================================= */

function showLoading(text){

    document.getElementById("app").innerHTML = `

        <div class="loading">

            <div class="spinner"></div>

            <div class="loadingText">
                ${escapeHtml(text)}
            </div>

        </div>

    `;

}


/* =========================================================
   ERROR
========================================================= */

function showError(title,message){

    document.getElementById("app").innerHTML = `

        <div class="errorBox">

            <h2>${escapeHtml(title)}</h2>

            <p>
                ${escapeHtml(message || "")}
            </p>

            <button
                class="startBtn"
                onclick="location.reload()">

                دوبارہ کوشش
