<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Quran Pak - Holy Quran</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#e9e1cf;
 color:#222;
 font-family:Arial,"Noto Naskh Arabic",sans-serif;
 transition:.3s;
}
body.dark{background:#121212;color:#eee}

header{
 position:sticky;top:0;z-index:20;
 background:#155d4a;color:white;
 padding:13px 12px;
 box-shadow:0 3px 12px #0004;
}
.top{
 display:flex;align-items:center;justify-content:space-between;
 gap:8px;
}
.logo{font-size:21px;font-weight:bold}
button,select,input{
 border:0;border-radius:9px;
 padding:10px;
 font-size:14px;
}
button{cursor:pointer;background:#e0b65a;color:#171717;font-weight:bold}
.icon{background:#ffffff22;color:white}

.controls{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:7px;margin-top:10px
}
input,select{width:100%;background:white;color:#222}

.container{max-width:850px;margin:auto;padding:12px}

.page{
 background:#fffdf5;
 min-height:780px;
 margin:10px auto;
 padding:25px 18px;
 border:7px double #b9944a;
 border-radius:5px;
 box-shadow:0 8px 25px #0002;
 position:relative;
}
body.dark .page{background:#1e1e1e;border-color:#8e743e}

.page:before{
 content:"";
 position:absolute;inset:7px;
 border:1px solid #c9ae70;
 pointer-events:none;
}

.bismillah{
 text-align:center;
 font-family:"Times New Roman",serif;
 font-size:28px;
 margin:12px 0 20px;
 color:#155d4a;
}
body.dark .bismillah{color:#e0b65a}

.surahHead{
 text-align:center;
 border-bottom:1px solid #c5aa70;
 padding-bottom:10px;
 margin-bottom:10px;
}
.surahHead h2{margin:5px;font-size:25px}

.line{
 min-height:42px;
 display:flex;
 align-items:center;
 border-bottom:1px dotted #cdbd98;
 gap:7px;
 padding:5px 0;
}
.lineNo{
 min-width:27px;height:27px;
 border:1px solid #b9944a;
 border-radius:50%;
 display:flex;align-items:center;justify-content:center;
 font-size:11px;
 color:#8c6d2f;
}
.arabic{
 flex:1;
 text-align:right;
 font-family:"Times New Roman","Noto Naskh Arabic",serif;
 font-size:22px;
 line-height:1.8;
}
.actions{display:flex;gap:3px}
.actions button{
 padding:5px 7px;font-size:11px;background:#155d4a;color:white
}

.bottom{
 display:flex;justify-content:space-between;align-items:center;
 margin-top:15px;
 border-top:1px solid #c9ae70;
 padding-top:10px;
}
.nav{
 display:flex;justify-content:center;gap:10px;margin:12px 0
}

.panel{
 background:#ffffffee;
 border-radius:12px;
 padding:12px;
 margin:10px 0;
 box-shadow:0 2px 12px #0002;
}
body.dark .panel{background:#202020}

.list{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:7px;
}
.surah{
 padding:10px;
 background:#f4eddb;
 border-radius:8px;
 cursor:pointer;
}
body.dark .surah{background:#292929}
.surah:hover{transform:scale(1.01)}

.translation{
 font-size:14px;
 color:#666;
 padding:5px 35px;
 display:none;
}
body.showTranslation .translation{display:block}
body.dark .translation{color:#bbb}

.searchResult{
 padding:10px;
 border-bottom:1px solid #bbb;
 cursor:pointer;
}
.searchResult b{color:#155d4a}

footer{text-align:center;padding:20px;color:#777}

@media(max-width:600px){
 .page{min-height:700px;padding:18px 10px}
 .arabic{font-size:20px;line-height:1.7}
 .list{grid-template-columns:1fr}
 .bismillah{font-size:24px}
}

@media print{
 header,.panel,.nav,footer{display:none}
 body{background:white}
 .page{box-shadow:none;border:0}
}
</style>
</head>

<body>

<header>
 <div class="top">
  <div class="logo">📖 قرآن پاک</div>
  <div>
   <button class="icon" onclick="toggleDark()">🌙</button>
   <button class="icon" onclick="toggleTranslation()">ترجمہ</button>
  </div>
 </div>

 <div class="controls">
  <select id="surahSelect" onchange="loadSurah(this.value)">
   <option value="">سورت منتخب کریں</option>
  </select>

  <select id="juzSelect" onchange="loadJuz(this.value)">
   <option value="">پارہ منتخب کریں</option>
  </select>

  <input id="searchBox" placeholder="🔍 قرآن میں لفظ تلاش کریں"
         onkeydown="if(event.key==='Enter')searchQuran()">

  <button onclick="searchQuran()">تلاش کریں</button>
 </div>
</header>

<div class="container">

 <div class="panel">
   <b>📚 قرآن پاک</b>
   <div style="margin-top:7px">
    سورت، پارہ، تلاش، آڈیو، بک مارک اور 16 لائن والا مطالعہ۔
   </div>
 </div>

 <div id="searchPanel" class="panel" style="display:none">
   <h3>🔍 تلاش کے نتائج</h3>
   <div id="searchResults"></div>
 </div>

 <div id="listPanel" class="panel">
   <h3>📖 سورتوں کی فہرست</h3>
   <div id="surahList" class="list"></div>
 </div>

 <div id="quranPage" class="page" style="display:none">

   <div class="surahHead">
    <h2 id="surahName">سورت</h2>
    <div id="surahInfo"></div>
   </div>

   <div class="bismillah" id="bismillah">
    بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيْمِ
   </div>

   <div id="ayahs"></div>

   <div class="bottom">
     <span id="pageInfo">صفحہ</span>
     <span id="juzInfo">پارہ</span>
   </div>
 </div>

 <div id="bookmarkPanel" class="panel" style="display:none">
   <h3>🔖 محفوظ آیات</h3>
   <div id="bookmarks"></div>
 </div>

 <div class="nav">
   <button onclick="previousSurah()">◀ پچھلی سورت</button>
   <button onclick="home()">🏠 ہوم</button>
   <button onclick="nextSurah()">اگلی سورت ▶</button>
 </div>

 <div class="panel" style="text-align:center">
   <button onclick="showBookmarks()">🔖 Bookmarks</button>
   <button onclick="window.print()">🖨️ Print</button>
 </div>

</div>

<footer>
 قرآن پاک — Holy Quran
</footer>

<script>
const API="https://api.alquran.cloud/v1";

let surahs=[];
let currentSurah=1;
let currentData=null;

/* ---------- START ---------- */

async function start(){
 try{
  const r=await fetch(API+"/surah");
  const j=await r.json();
  surahs=j.data;
  fillSurahs();
  fillJuz();
  createSurahList();
 }catch(e){
  alert("Quran data load نہیں ہو سکا۔ Internet چیک کریں۔");
 }
}

function fillSurahs(){
 const s=document.getElementById("surahSelect");

 surahs.forEach(x=>{
  let o=document.createElement("option");
  o.value=x.number;
  o.textContent=x.number+" — "+x.name+" — "+x.englishName;
  s.appendChild(o);
 });
}

function fillJuz(){
 const j=document.getElementById("juzSelect");

 for(let i=1;i<=30;i++){
  let o=document.createElement("option");
  o.value=i;
  o.textContent="پارہ "+i;
  j.appendChild(o);
 }
}

function createSurahList(){
 const box=document.getElementById("surahList");
 box.innerHTML="";

 surahs.forEach(s=>{
  let d=document.createElement("div");
  d.className="surah";
  d.innerHTML=
   "<b>"+s.number+". "+s.name+"</b><br>"+
   "<small>"+s.englishName+" • "+s.numberOfAyahs+" آیات</small>";
  d.onclick=()=>loadSurah(s.number);
  box.appendChild(d);
 });
}

/* ---------- SURAH ---------- */

async function loadSurah(number){
 if(!number)return;

 currentSurah=Number(number);

 document.getElementById("listPanel").style.display="none";
 document.getElementById("searchPanel").style.display="none";
 document.getElementById("bookmarkPanel").style.display="none";
 document.getElementById("quranPage").style.display="block";

 document.getElementById("ayahs").innerHTML=
  "<div style='text-align:center;padding:30px'>⏳ قرآن پاک لوڈ ہو رہا ہے...</div>";

 try{
  const r=await fetch(API+"/surah/"+number+"/quran-uthmani");
  const j=await r.json();
  currentData=j.data;
  renderAyahs(currentData);
 }catch(e){
  document.getElementById("ayahs").innerHTML=
   "❌ قرآن لوڈ نہیں ہو سکا۔ Internet چیک کریں۔";
 }
}

function renderAyahs(data){
 document.getElementById("surahName").textContent=
   data.name+" — "+data.englishName;

 document.getElementById("surahInfo").textContent=
   data.revelationType+" • "+data.numberOfAyahs+" آیات";

 document.getElementById("pageInfo").textContent=
   "سورت نمبر "+data.number;

 let html="";

 data.ayahs.forEach((a,i)=>{

  let saved=isBookmarked(a.number);

  html+=`
   <div class="line" id="ayah-${a.number}">
    <div class="lineNo">${a.numberInSurah}</div>

    <div class="arabic">
      ${a.text}
      <div class="translation" id="tr-${a.number}">
        ترجمہ لوڈ ہو رہا ہے...
      </div>
    </div>

    <div class="actions">
      <button onclick="playAyah(${a.number})">▶</button>
      <button onclick="bookmark(${a.number},${data.number},${a.numberInSurah})">
       ${saved?"★":"☆"}
      </button>
    </div>
   </div>`;
 });

 document.getElementById("ayahs").innerHTML=html;

 /* 16 line style: visual spacing */
 document.getElementById("ayahs").style.lineHeight="1.75";

 loadTranslations(data.number);
}

/* ---------- TRANSLATION ---------- */

async function loadTranslations(surah){
 try{
  const r=await fetch(API+"/surah/"+surah+"/ur.jalandhry");
  const j=await r.json();

  j.data.ayahs.forEach(a=>{
   let x=document.getElementById("tr-"+a.number);
   if(x)x.textContent=a.text;
  });
 }catch(e){
  console.log("Translation unavailable");
 }
}

function toggleTranslation(){
 document.body.classList.toggle("showTranslation");
}

/* ---------- AUDIO ---------- */

function playAyah(number){
 const audio=
  "https://cdn.islamic.network/quran/audio/128/ar.alafasy/"
  +number+".mp3";

 let old=document.getElementById("audioPlayer");
 if(old)old.remove();

 let a=document.createElement("audio");
 a.id="audioPlayer";
 a.controls=true;
 a.autoplay=true;
 a.src=audio;
 a.style.position="fixed";
 a.style.bottom="10px";
 a.style.left="10px";
 a.style.right="10px";
 a.style.width="calc(100% - 20px)";
 a.style.zIndex="100";

 document.body.appendChild(a);
}

/* ---------- BOOKMARK ---------- */

function getBookmarks(){
 return JSON.parse(localStorage.getItem("quranBookmarks")||"[]");
}

function isBookmarked(ayah){
 return getBookmarks().some(x=>x.ayah===ayah);
}

function bookmark(ayah,surah,ayahInSurah){

 let b=getBookmarks();

 const index=b.findIndex(x=>x.ayah===ayah);

 if(index>=0){
  b.splice(index,1);
 }else{
  b.push({
   ayah:ayah,
   surah:surah,
   ayahInSurah:ayahInSurah
  });
 }

 localStorage.setItem("quranBookmarks",JSON.stringify(b));

 if(currentData)renderAyahs(currentData);
}

function showBookmarks(){
 document.getElementById("listPanel").style.display="none";
 document.getElementById("quranPage").style.display="none";
 document.getElementById("searchPanel").style.display="none";
 document.getElementById("bookmarkPanel").style.display="block";

 let b=getBookmarks();
 let box=document.getElementById("bookmarks");

 if(!b.length){
  box.innerHTML="ابھی کوئی آیت محفوظ نہیں کی گئی۔";
  return;
 }

 box.innerHTML=b.map(x=>`
  <div class="searchResult"
       onclick="loadSurah(${x.surah});setTimeout(()=>document.getElementById('ayah-${x.ayah}')?.scrollIntoView(),700)">
   🔖 سورت ${x.surah} — آیت ${x.ayahInSurah}
  </div>
 `).join("");
}

/* ---------- SEARCH ---------- */

async function searchQuran(){

 let word=document.getElementById("searchBox").value.trim();

 if(!word){
  alert("پہلے کوئی لفظ لکھیں");
  return;
 }

 document.getElementById("listPanel").style.display="none";
 document.getElementById("quranPage").style.display="none";
 document.getElementById("bookmarkPanel").style.display="none";
 document.getElementById("searchPanel").style.display="block";

 let box=document.getElementById("searchResults");
 box.innerHTML="⏳ تلاش ہو رہی ہے...";

 try{
  const r=await fetch(
   API+"/search/"+encodeURIComponent(word)+"/all/quran-uthmani"
  );

  const j=await r.json();

  if(!j.data || !j.data.matches || !j.data.matches.length){
   box.innerHTML="کوئی نتیجہ نہیں ملا۔";
   return;
  }

  box.innerHTML=j.data.matches.map(x=>`
   <div class="searchResult"
        onclick="loadSurah(${x.surah.number});setTimeout(()=>document.getElementById('ayah-${x.number}')?.scrollIntoView(),800)">
    <b>${x.surah.number}. ${x.surah.name}</b>
    — آیت ${x.numberInSurah}
    <br>
    ${x.text}
   </div>
  `).join("");

 }catch(e){
  box.innerHTML="❌ Search نہیں چل رہی۔ Internet چیک کریں۔";
 }
}

/* ---------- JUZ ---------- */

async function loadJuz(number){

 if(!number)return;

 document.getElementById("listPanel").style.display="none";
 document.getElementById("quranPage").style.display="block";
 document.getElementById("searchPanel").style.display="none";

 document.getElementById("ayahs").innerHTML=
  "<div style='padding:30px;text-align:center'>⏳ پارہ لوڈ ہو رہا ہے...</div>";

 try{
  const r=await fetch(API+"/juz/"+number+"/quran-uthmani");
  const j=await r.json();

  let data=j.data;

  document.getElementById("surahName").textContent=
   "پارہ "+number;

  document.getElementById("surahInfo").textContent=
   "Juz "+number;

  let html="";

  data.ayahs.forEach(a=>{
   html+=`
   <div class="line">
    <div class="lineNo">${a.numberInSurah}</div>
    <div class="arabic">${a.text}</div>
    <div class="actions">
     <button onclick="playAyah(${a.number})">▶</button>
     <button onclick="bookmark(${a.number},${a.surah.number},${a.numberInSurah})">☆</button>
    </div>
   </div>`;
  });

  document.getElementById("ayahs").innerHTML=html;

 }catch(e){
  document.getElementById("ayahs").innerHTML=
   "❌ پارہ لوڈ نہیں ہو سکا۔";
 }
}

/* ---------- NAVIGATION ---------- */

function previousSurah(){
 if(currentSurah>1)loadSurah(currentSurah-1);
}

function nextSurah(){
 if(currentSurah<114)loadSurah(currentSurah+1);
}

function home(){
 document.getElementById("quranPage").style.display="none";
 document.getElementById("searchPanel").style.display="none";
 document.getElementById("bookmarkPanel").style.display="none";
 document.getElementById("listPanel").style.display="block";
 window.scrollTo(0,0);
}

/* ---------- DARK MODE ---------- */

function toggleDark(){
 document.body.classList.toggle("dark");

 localStorage.setItem(
  "darkMode",
  document.body.classList.contains("dark")?"1":"0"
 );
}

if(localStorage.getItem("darkMode")==="1"){
 document.body.classList.add("dark");
}

/* ---------- RUN ---------- */

start();
</script>

</body>
</html>
