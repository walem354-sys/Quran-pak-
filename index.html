<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>قرآن پاک — Al Quran-ul-Kareem</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:#d8ccb1;
}

body{
 font-family:"Noto Naskh Arabic","Amiri",serif;
 color:#211d16;
}

.app{
 width:100%;
 height:100vh;
 overflow:hidden;
 position:relative;
}

.top{
 height:54px;
 background:#075e54;
 color:#fff;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 9px;
}

.title{
 font-size:19px;
 font-weight:bold;
}

.topBtns{
 display:flex;
 gap:5px;
}

.topBtns button{
 width:37px;
 height:37px;
 border:0;
 border-radius:9px;
 background:#ffffff22;
 color:white;
 font-size:18px;
}

.selectArea{
 height:45px;
 padding:4px 8px;
 background:#f4ead3;
 border-bottom:1px solid #b7a57e;
}

#surahSelect{
 width:100%;
 height:37px;
 border:1px solid #a69165;
 border-radius:8px;
 background:#fff;
 font-size:15px;
 padding:0 8px;
}

.bookArea{
 height:calc(100vh - 99px);
 padding:6px;
 perspective:1400px;
 overflow:hidden;
}

.book{
 width:100%;
 height:100%;
 max-width:700px;
 margin:auto;
 position:relative;
 overflow:hidden;
 background:#fffdf5;
 border:2px solid #ae9561;
 border-radius:5px;
 box-shadow:0 4px 20px #0005;
 touch-action:none;
 user-select:none;
}

.page{
 width:100%;
 height:100%;
 overflow:hidden;
 background:
 radial-gradient(circle at center,#fffef9 0,#fffdf5 70%,#f0e5ca 100%);
 transition:transform .43s ease,opacity .43s ease;
 transform-origin:center center;
}

.page.next{
 transform:rotateY(-88deg);
 opacity:.15;
}

.page.prev{
 transform:rotateY(88deg);
 opacity:.15;
}

.content{
 width:100%;
 height:100%;
 padding:5px 9px 8px;
 display:flex;
 flex-direction:column;
 overflow:hidden;
}

.loading{
 width:100%;
 height:100%;
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
 font-size:19px;
 color:#756746;
}

.surahBox{
 flex-shrink:0;
 width:97%;
 margin:0 auto 4px;
 padding:3px 6px 5px;
 text-align:center;
 border:2px solid #a4884b;
 border-radius:13px;
 background:linear-gradient(#fcf4df,#f2e5c6);
 box-shadow:inset 0 0 0 2px #e7d5ab;
}

.surahName{
 font-size:23px;
 font-weight:bold;
 line-height:1.15;
 color:#634a20;
}

.surahInfo{
 display:flex;
 justify-content:center;
 gap:12px;
 margin-top:1px;
 font-family:Arial,sans-serif;
 font-size:10px;
 color:#655638;
}

.bismillah{
 margin-top:2px;
 padding-top:2px;
 border-top:1px solid #c9b687;
 font-size:23px;
 line-height:1.25;
 color:#2b2418;
}

.ayahArea{
 flex:1;
 min-height:0;
 display:flex;
 flex-direction:column;
 justify-content:space-evenly;
 overflow:hidden;
 padding:0 3px;
}

.ayah{
 position:relative;
 direction:rtl;
 text-align:right;
 font-size:21px;
 line-height:1.47;
 padding:1px 0 3px;
 border-bottom:1px dotted #c8b88f;
 word-spacing:1px;
}

.ayah:last-child{
 border-bottom:0;
}

.ayahNumber{
 display:inline-flex;
 align-items:center;
 justify-content:center;
 width:24px;
 height:24px;
 border:1px solid #94783f;
 border-radius:50%;
 font-family:Arial,sans-serif;
 font-size:9px;
 color:#684e20;
 margin-right:4px;
 vertical-align:middle;
}

.audioBtn{
 position:absolute;
 left:0;
 top:2px;
 width:22px;
 height:22px;
 border:0;
 border-radius:50%;
 background:#075e54;
 color:white;
 font-size:9px;
}

.pageNumber{
 position:absolute;
 bottom:3px;
 left:50%;
 transform:translateX(-50%);
 font-family:Arial,sans-serif;
 font-size:9px;
 color:#817353;
}

.searchPanel{
 display:none;
 position:absolute;
 z-index:50;
 top:58px;
 left:8px;
 right:8px;
 background:white;
 border-radius:12px;
 padding:8px;
 box-shadow:0 5px 20px #0006;
 font-family:Arial,sans-serif;
}

.searchPanel input{
 width:100%;
 height:40px;
 border:1px solid #aaa;
 border-radius:8px;
 padding:0 10px;
 font-size:16px;
}

.results{
 max-height:280px;
 overflow:auto;
 margin-top:6px;
}

.result{
 padding:8px;
 border-bottom:1px solid #ddd;
 font-size:13px;
}

.dark{
 background:#111;
 color:#eee;
}

.dark .selectArea{
 background:#202020;
 border-color:#444;
}

.dark #surahSelect{
 background:#292929;
 color:#fff;
 border-color:#555;
}

.dark .book{
 background:#24231e;
 border-color:#665b43;
}

.dark .page{
 background:#24231e;
}

.dark .surahBox{
 background:linear-gradient(#302b20,#29251c);
 border-color:#806d42;
}

.dark .surahName{
 color:#dfc889;
}

.dark .surahInfo{
 color:#c4b99e;
}

.dark .bismillah{
 color:#eee;
 border-color:#64583d;
}

.dark .ayah{
 border-color:#4b4538;
}

.dark .ayahNumber{
 color:#ddc78d;
}

.dark .searchPanel{
 background:#292929;
 color:#fff;
}

.dark .searchPanel input{
 background:#171717;
 color:#fff;
 border-color:#555;
}

@media(max-width:380px){
 .surahName{font-size:21px}
 .bismillah{font-size:20px}
 .ayah{font-size:18px;line-height:1.43}
 .ayahNumber{width:22px;height:22px}
}

@media(min-width:500px){
 .surahName{font-size:27px}
 .bismillah{font-size:26px}
 .ayah{font-size:25px;line-height:1.5}
}
</style>
</head>

<body>

<div class="app">

<div class="top">
<div class="title">📖 قرآن پاک</div>

<div class="topBtns">
<button onclick="openSearch()">🔎</button>
<button onclick="toggleDark()">🌙</button>
<button onclick="saveBookmark()">🔖</button>
<button onclick="playPage()">🔊</button>
</div>
</div>

<div class="selectArea">
<select id="surahSelect">
<option value="">سورۃ منتخب کریں</option>
</select>
</div>

<div class="searchPanel" id="searchPanel">
<input id="searchInput" placeholder="قرآن پاک میں لفظ تلاش کریں...">
<div class="results" id="results"></div>
</div>

<div class="bookArea">

<div class="book" id="book">

<div class="page" id="page">

<div class="content" id="content">

<div class="loading">
قرآن پاک لوڈ ہو رہا ہے...<br>
براہ کرم انتظار کریں۔
</div>

</div>

</div>

</div>

</div>
</div>

<script>

const API="https://api.alquran.cloud/v1";

let currentPage=1;
let currentData=null;
let audio=null;
let startX=0;
let startY=0;

const surahs=[
"الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف",
"الأنفال","التوبة","يونس","هود","يوسف","الرعد","إبراهيم","الحجر",
"النحل","الإسراء","الكهف","مريم","طه","الأنبياء","الحج","المؤمنون",
"النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم",
"لقمان","السجدة","الأحزاب","سبإ","فاطر","يس","الصافات","ص","الزمر",
"غافر","فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد",
"الفتح","الحجرات","ق","الذاريات","الطور","النجم","القمر","الرحمن",
"الواقعة","الحديد","المجادلة","الحشر","الممتحنة","الصف","الجمعة",
"المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة",
"المعارج","نوح","الجن","المزمل","المدثر","القيامة","الإنسان",
"المرسلات","النبأ","النازعات","عبس","التكوير","الانفطار","المطففين",
"الانشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد",
"الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة",
"الزلزلة","العادیات","القارعة","التكاثر","العصر","الهمزة","الفيل",
"قريش","الماعون","الكوثر","الكافرون","النصر","المسد","الإخلاص",
"الفلق","الناس"
];

const select=document.getElementById("surahSelect");

surahs.forEach((name,i)=>{
 const o=document.createElement("option");
 o.value=i+1;
 o.textContent=(i+1)+" — "+name;
 select.appendChild(o);
});

select.addEventListener("change",goToSurah);

async function loadPage(page){

 if(page<1)page=1;
 if(page>604)page=604;

 currentPage=page;

 const content=document.getElementById("content");

 content.innerHTML=
 `<div class="loading">
 صفحہ ${page} لوڈ ہو رہا ہے...<br>
 براہ کرم انتظار کریں۔
 </div>`;

 try{

   const url=API+"/page/"+page+"/quran-uthmani";

   const response=await fetch(url,{cache:"no-store"});

   if(!response.ok)throw new Error("API error");

   const json=await response.json();

   if(!json||!json.data||!json.data.ayahs){
      throw new Error("No data");
   }

   currentData=json.data;

   renderPage(json.data);

 }catch(error){

   content.innerHTML=
   `<div class="loading">
   قرآن پاک لوڈ نہیں ہو سکا۔<br><br>
   انٹرنیٹ چیک کریں اور صفحہ دوبارہ کھولیں۔
   <br><br>
   <button onclick="loadPage(${page})"
   style="padding:10px 20px;border:0;border-radius:8px;background:#075e54;color:white">
   دوبارہ کوشش کریں
   </button>
   </div>`;

 }
}

function renderPage(data){

 const content=document.getElementById("content");

 content.innerHTML="";

 let groups={};

 data.ayahs.forEach(a=>{

   const s=a.surah.number;

   if(!groups[s])groups[s]=[];

   groups[s].push(a);

 });

 Object.keys(groups).forEach(s=>{

   const ayahs=groups[s];

   const first=ayahs[0];

   const box=document.createElement("div");

   box.className="surahBox";

   const name=document.createElement("div");

   name.className="surahName";

   name.textContent=surahs[Number(s)-1]||first.surah.name;

   box.appendChild(name);

   const info=document.createElement("div");

   info.className="surahInfo";

   const place=
   first.surah.revelationType==="Meccan"
   ?"مکی":"مدنی";

   info.innerHTML=
   `<span>${place}</span>
    <span>آیات: ${first.surah.numberOfAyahs}</span>
    <span>رکوع: —</span>`;

   box.appendChild(info);

   if(first.numberInSurah===1 && Number(s)!==9){

     const b=document.createElement("div");

     b.className="bismillah";

     b.textContent="بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيْمِ";

     box.appendChild(b);

   }

   content.appendChild(box);

   const area=document.createElement("div");

   area.className="ayahArea";

   ayahs.forEach(a=>{

     const row=document.createElement("div");

     row.className="ayah";

     row.appendChild(
       document.createTextNode(a.text+" ")
     );

     const num=document.createElement("span");

     num.className="ayahNumber";

     num.textContent=a.numberInSurah;

     row.appendChild(num);

     if(a.audio){

       const btn=document.createElement("button");

       btn.className="audioBtn";

       btn.textContent="▶";

       btn.onclick=(e)=>{
         e.stopPropagation();
         playAudio(a.audio);
       };

       row.appendChild(btn);

     }

     area.appendChild(row);

   });

   content.appendChild(area);

 });

 const p=document.createElement("div");

 p.className="pageNumber";

 p.textContent="صفحہ "+currentPage+" / 604";

 content.appendChild(p);
}

function goToSurah(){

 const n=Number(select.value);

 if(!n)return;

 loadSurahPage(n);
}

async function loadSurahPage(n){

 try{

   const response=await fetch(
     API+"/surah/"+n+"/quran-uthmani",
     {cache:"no-store"}
   );

   if(!response.ok)throw new Error();

   const json=await response.json();

   const first=json.data.ayahs[0];

   if(first&&first.page){

     loadPage(first.page);

   }

 }catch(e){

   alert("سورۃ لوڈ نہیں ہو سکی۔");

 }
}

function playAudio(url){

 stopAudio();

 audio=new Audio(url);

 audio.play().catch(()=>{
   alert("آڈیو چلانے کے لیے دوبارہ دبائیں۔");
 });
}

async function playPage(){

 if(!currentData)return;

 stopAudio();

 for(const a of currentData.ayahs){

   if(!a.audio)continue;

   await new Promise(resolve=>{

     audio=new Audio(a.audio);

     audio.onended=resolve;
     audio.onerror=resolve;

     audio.play().catch(resolve);

   });

 }
}

function stopAudio(){

 if(audio){

   audio.pause();
   audio.currentTime=0;
   audio=null;

 }
}

function openSearch(){

 const p=document.getElementById("searchPanel");

 p.style.display=
 p.style.display==="block"?"none":"block";

 if(p.style.display==="block"){
   document.getElementById("searchInput").focus();
 }
}

let searchTimer;

document.getElementById("searchInput")
.addEventListener("input",function(){

 clearTimeout(searchTimer);

 const word=this.value.trim();

 const results=document.getElementById("results");

 if(word.length<2){

   results.innerHTML="کم از کم 2 حروف لکھیں۔";

   return;
 }

 results.innerHTML="تلاش ہو رہی ہے...";

 searchTimer=setTimeout(
   ()=>searchQuran(word),500
 );

});

async function searchQuran(word){

 try{

   const response=await fetch(
     API+"/search/"+encodeURIComponent(word)+"/all/quran-uthmani"
   );

   if(!response.ok)throw new Error();

   const json=await response.json();

   const matches=
   json.data&&json.data.matches
   ?json.data.matches:[];

   const results=document.getElementById("results");

   if(!matches.length){

     results.innerHTML="لفظ نہیں ملا۔";

     return;
   }

   results.innerHTML=matches.slice(0,50).map(m=>`

     <div class="result"
          onclick="loadPage(${m.page});closeSearch()">

       <b>${escapeHtml(m.surah.name)}</b>
       — آیت ${m.numberInSurah}

       <br>

       ${escapeHtml(m.text)}

     </div>

   `).join("");

 }catch(e){

   document.getElementById("results").innerHTML=
   "تلاش میں مسئلہ آیا۔";

 }
}

function closeSearch(){

 document.getElementById("searchPanel").style.display="none";

}

function saveBookmark(){

 localStorage.setItem("quranBookmark",currentPage);

 alert("صفحہ "+currentPage+" محفوظ ہوگیا۔");

}

function toggleDark(){

 document.body.classList.toggle("dark");

 localStorage.setItem(
   "quranDark",
   document.body.classList.contains("dark")?"1":"0"
 );

}

if(localStorage.getItem("quranDark")==="1"){
 document.body.classList.add("dark");
}

function escapeHtml(t){

 return String(t||"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");

}


/* ===========================
   انگلی سے صفحہ پلٹنا
=========================== */

const book=document.getElementById("book");

book.addEventListener("touchstart",e=>{

 const t=e.changedTouches[0];

 startX=t.clientX;
 startY=t.clientY;

},{passive:true});

book.addEventListener("touchend",e=>{

 const t=e.changedTouches[0];

 const dx=t.clientX-startX;
 const dy=t.clientY-startY;

 if(Math.abs(dx)<60)return;

 if(Math.abs(dx)<Math.abs(dy))return;

 const page=document.getElementById("page");

 if(dx<0){

   page.classList.add("next");

   setTimeout(()=>{

     page.classList.remove("next");

     loadPage(currentPage+1);

   },250);

 }else{

   page.classList.add("prev");

   setTimeout(()=>{

     page.classList.remove("prev");

     loadPage(currentPage-1);

   },250);

 }

},{passive:true});


/* پہلی بار صفحہ 1 */

loadPage(1);

</script>

</body>
</html>
