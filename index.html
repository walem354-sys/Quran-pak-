<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>القرآن الكريم — Al Quran-ul-Kareem</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#e8e1d0;color:#222;font-family:Arial,sans-serif}
body.dark{background:#151515;color:#eee}

header{
 height:68px;background:linear-gradient(135deg,#075d37,#087443,#06492c);
 color:white;display:flex;align-items:center;justify-content:space-between;
 padding:0 12px;position:relative;z-index:10;
 box-shadow:0 2px 8px #0005
}
.title{text-align:center;flex:1}
.titleArabic{font-family:"Amiri",serif;font-size:28px;font-weight:bold;line-height:1.05;color:#f5dc91}
.titleEnglish{font-family:Georgia,serif;font-size:15px;letter-spacing:1px;direction:ltr}
.logo{font-family:"Amiri",serif;font-size:31px;color:#f5dc91;width:55px;text-align:center}
.topBtns{display:flex;gap:5px}
.topBtns button{
 border:0;background:#ffffff20;color:white;border-radius:50%;
 width:40px;height:40px;font-size:19px
}

.searchBox{display:none;padding:7px 10px;background:#075c36}
.searchBox input{width:100%;height:40px;border:0;border-radius:9px;padding:8px;font-size:16px}

#book{
 height:calc(100vh - 118px);margin:0 7px 7px;position:relative;
 background:linear-gradient(90deg,#d6c6a5,#fdf8e9 4%,#fffdf5 50%,#fdf8e9 96%,#d6c6a5);
 border-radius:8px;box-shadow:0 4px 20px #0005,inset 0 0 25px #8b765533;
 overflow:hidden;touch-action:pan-y
}
.dark #book{background:linear-gradient(90deg,#242424,#303030 5%,#303030 50%,#303030 95%,#222)}

.page{
 width:100%;height:100%;overflow-y:auto;overflow-x:hidden;
 padding:5px 5px 35px;position:relative;scrollbar-width:none;
 touch-action:pan-y
}
.page::-webkit-scrollbar{display:none}

.page.turnNext{animation:nextPage .35s ease}
.page.turnPrev{animation:prevPage .35s ease}
@keyframes nextPage{0%{transform:perspective(900px) rotateY(0);opacity:1}50%{transform:perspective(900px) rotateY(-10deg);opacity:.55}100%{transform:perspective(900px) rotateY(0);opacity:1}}
@keyframes prevPage{0%{transform:perspective(900px) rotateY(0);opacity:1}50%{transform:perspective(900px) rotateY(10deg);opacity:.55}100%{transform:perspective(900px) rotateY(0);opacity:1}}

.pageTop{
 display:grid;grid-template-columns:1fr 72px 1fr;gap:5px;align-items:center;padding:5px 2px
}
.pageTopBox{
 border:2px solid #b28b3f;background:#fff9e8;border-radius:15px;
 padding:4px 6px;text-align:center;font-family:"Amiri",serif;font-size:14px;font-weight:bold;
 box-shadow:0 2px 7px #0002;white-space:nowrap;overflow:hidden
}
.pageTopBox.center{background:#087443;color:#f9df91;border-radius:30px;font-family:Arial,sans-serif;font-size:12px}
.dark .pageTopBox{background:#34301f;color:#f1d78c}
.dark .pageTopBox.center{background:#087443}

.quranSheet{
 border:5px double #9d7b36;border-radius:8px;padding:9px 8px 14px;
 background:radial-gradient(circle,#fffdf3,#f8edcf);
 box-shadow:0 5px 18px #0003,inset 0 0 30px #b59a5833;
 min-height:calc(100% - 42px);position:relative
}
.dark .quranSheet{background:radial-gradient(circle,#393528,#28261e);border-color:#c5a85d}

.quranSheet:before,.quranSheet:after{
 content:"۞";position:absolute;color:#a67c2c;font-family:"Amiri",serif;font-size:27px;z-index:2
}
.quranSheet:before{top:2px;left:7px}
.quranSheet:after{bottom:2px;right:7px}

.surahBox{
 border:3px solid #b28b3f;border-radius:24px;padding:7px 9px 8px;
 margin:0 0 7px;background:linear-gradient(135deg,#fff8dc,#fffdf4,#f1dfae);
 text-align:center;box-shadow:0 4px 12px #0003;position:relative
}
.dark .surahBox{background:linear-gradient(135deg,#403a27,#292719);border-color:#c9aa61}
.surahBox:before,.surahBox:after{content:"❖";position:absolute;top:6px;color:#b28b3f;font-size:20px}
.surahBox:before{left:9px}.surahBox:after{right:9px}
.surahName{font-family:"Amiri",serif;font-size:30px;font-weight:bold;color:#075d37;line-height:1.25}
.dark .surahName{color:#e1c26f}
.meta{font-size:12px;margin:0;color:#555}
.dark .meta{color:#ddd}

.bismillahBox{
 border:2px solid #b28b3f;border-radius:25px;background:linear-gradient(135deg,#075c36,#087443,#06492c);
 padding:3px 7px;margin:5px auto 6px;max-width:92%;text-align:center;
 box-shadow:inset 0 0 10px #ffffff18
}
.bismillah{font-family:"Amiri",serif;font-size:25px;font-weight:bold;line-height:1.65;color:#f8e2a0}

.ayah{
 font-family:"Amiri",serif;font-size:24px;line-height:1.75;text-align:right;
 margin:0;padding:4px 2px;color:#111;direction:rtl;border-bottom:1px solid #a89570;
 position:relative
}
.dark .ayah{color:#f4f4f4;border-color:#777}

.ayahText{display:inline}
.ayahNum{
 display:inline-flex;width:28px;height:28px;border:2px solid #a58a4d;border-radius:50%;
 align-items:center;justify-content:center;font-family:Arial,sans-serif;font-size:11px;
 color:#765c28;margin:0 4px;vertical-align:middle;background:#fffaf0
}
.dark .ayahNum{color:#e0c47d;border-color:#c9a95c;background:#302d22}

.opening{
 display:inline-block;font-family:"Amiri",serif!important;font-size:40px!important;
 font-weight:bold;color:#075d37;line-height:1.15;padding:0 5px
}
.dark .opening{color:#e5c978}

.pageBottom{
 display:grid;grid-template-columns:1fr 72px 1fr;gap:5px;align-items:center;margin-top:7px
}
.bottomBox{
 border:2px solid #b28b3f;background:#fff9e8;border-radius:15px;padding:4px;
 text-align:center;font-family:"Amiri",serif;font-size:14px
}
.dark .bottomBox{background:#34301f;color:#f1d78c}
.pageNumber{
 text-align:center;background:#087443;color:#f9df91;border:2px solid #b28b3f;
 border-radius:22px;padding:5px 3px;font-family:Arial,sans-serif;font-size:12px
}

.coverPage{
 height:100%;width:100%;position:relative;overflow:hidden;
 background:radial-gradient(circle at center,#fffdf2,#f8edcf 55%,#e4d1a0);
 display:flex;align-items:center;justify-content:center;padding:12px
}
.dark .coverPage{background:radial-gradient(circle at center,#403c2d,#292719 60%,#171717)}
.coverFrame{
 width:100%;height:100%;border:3px solid #b28b3f;border-radius:18px;position:relative;
 display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 5px #f5e5b9,inset 0 0 30px #8d703333,0 4px 15px #0003;padding:18px
}
.coverContent{text-align:center;width:100%}
.mainTitleBox{
 max-width:430px;margin:auto;padding:25px 12px 24px;border:4px solid #b28b3f;border-radius:38px;
 background:radial-gradient(circle at center,#0c7545,#075d37 60%,#043d26);
 box-shadow:0 8px 25px #0005,inset 0 0 25px #ffffff12;position:relative
}
.decoration{color:#e1bd65;font-size:27px;line-height:1;margin:2px 0 5px;font-family:"Amiri",serif}
.coverTitle{font-family:"Amiri",serif;color:#fff0bd;font-size:47px;font-weight:bold;line-height:1.45;text-shadow:0 2px 3px #0008}
.coverEnglish{color:#e4c776;font-family:Georgia,serif;font-size:17px;font-weight:bold;letter-spacing:1px;margin-top:5px;direction:ltr}
.startButton{margin-top:20px;border:2px solid #b28b3f;background:linear-gradient(135deg,#087443,#075c36);color:#fff3c4;border-radius:25px;padding:10px 23px;font-family:"Amiri",serif;font-size:18px;font-weight:bold}
.loading{text-align:center;padding-top:100px;font-size:20px;font-family:"Amiri",serif}
.error{text-align:center;padding:50px 15px;font-size:18px}
.status{position:fixed;bottom:5px;left:50%;transform:translateX(-50%);background:#0009;color:#fff;padding:4px 10px;border-radius:15px;font-size:11px;z-index:30}
.searchResults{display:none;position:absolute;top:118px;left:10px;right:10px;bottom:10px;background:#fff;z-index:20;border-radius:12px;overflow:auto;padding:10px}
.dark .searchResults{background:#222;color:white}
.result{padding:10px;border-bottom:1px solid #ccc;font-family:"Amiri",serif;font-size:19px}
@media(max-width:420px){.ayah{font-size:22px;line-height:1.72}.surahName{font-size:27px}.bismillah{font-size:23px}.opening{font-size:37px!important}.titleArabic{font-size:25px}}
</style>
</head>

<body>
<header>
<div class="logo">ﷲ</div>
<div class="title">
 <div class="titleArabic">القرآن الكريم</div>
 <div class="titleEnglish">AL QURAN UL KAREEM</div>
</div>
<div class="topBtns">
 <button onclick="toggleSearch()">🔎</button>
 <button onclick="toggleDark()">🌙</button>
 <button onclick="bookmarkPage()">🔖</button>
</div>
</header>

<div class="searchBox" id="searchBox">
<input id="searchInput" type="text" placeholder="قرآن میں لفظ تلاش کریں..." onkeydown="if(event.key==='Enter')searchQuran()">
</div>

<div id="book">
<div class="page" id="page"></div>
</div>

<div class="searchResults" id="searchResults"></div>
<div class="status" id="status">قرآن پاک لوڈ ہو رہا ہے...</div>

<script>
const API="https://api.alquran.cloud/v1/quran/quran-uthmani";
let pages=[];
let currentPage=0;
let touchStartX=0,touchStartY=0;

const surahNames=[
"الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة",
"يونس","هود","يوسف","الرعد","إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه",
"الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم",
"لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر","غافر","فصلت",
"الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات","ق","الذاريات",
"الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة","الصف",
"الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج","نوح",
"الجن","المزمل","المدثر","القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس","التكوير",
"الإنفطار","المطففين","الإنشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد","الشمس",
"الليل","الضحى","الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات","القارعة",
"التكاثر","العصر","الهمزة","الفيل","قريش","الماعون","الكوثر","الكافرون","النصر","المسد",
"الإخلاص","الفلق","الناس"
];

function toggleDark(){
 document.body.classList.toggle("dark");
 localStorage.setItem("quranDark",document.body.classList.contains("dark"));
}
if(localStorage.getItem("quranDark")==="true")document.body.classList.add("dark");

function toggleSearch(){
 const s=document.getElementById("searchBox");
 s.style.display=s.style.display==="block"?"none":"block";
 if(s.style.display==="block")document.getElementById("searchInput").focus();
}

function bookmarkPage(){
 localStorage.setItem("quranBookmark",currentPage);
 showStatus("صفحہ محفوظ ہوگیا");
}

function showStatus(t){
 const e=document.getElementById("status");e.textContent=t;
 setTimeout(()=>{if(t!=="قرآن پاک لوڈ ہو رہا ہے...")e.textContent="صفحہ "+(currentPage+1)+" / 604"},1800);
}

function goToPage(n){
 if(n<0)n=0;if(n>603)n=603;
 if(!pages.length)return;
 currentPage=n;
 renderPage();
}

function nextPage(){if(currentPage<603){currentPage++;renderPage("next")}}
function prevPage(){if(currentPage>0){currentPage--;renderPage("prev")}}

function cleanText(text){
 return text.replace(/\s+/g," ").trim();
}

function renderPage(anim=""){
 const page=document.getElementById("page");
 page.className="page";
 if(anim)void page.offsetWidth;
 if(anim)page.classList.add(anim==="next"?"turnNext":"turnPrev");

 const data=pages[currentPage]||[];
 let html=`
 <div class="pageTop">
  <div class="pageTopBox">${data[0]?data[0].surahName:"القرآن الكريم"}</div>
  <div class="pageTopBox center">${currentPage+1}</div>
  <div class="pageTopBox">${data[0]?"جزء "+(data[0].juz||"1"):"قرآن پاک"}</div>
 </div>
 <div class="quranSheet">`;

 let lastSurah=null;
 data.forEach((a,i)=>{
   if(a.surah!==lastSurah){
     lastSurah=a.surah;
     html+=`
      <div class="surahBox">
       <div class="surahName">سُورَةُ ${a.surahName}</div>
       <div class="meta">${a.revelationType||"القرآن الكريم"} — سورة ${a.surah}</div>
      </div>`;
     if(a.surah!==1 && a.ayahInSurah===1){
       html+=`<div class="bismillahBox"><div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</div></div>`;
     }
   }

   let text=cleanText(a.text);
   if(a.ayahInSurah===1 && /^(الم|المص|الر|المر|كهيعص|طه|طسم|طس|يس|ص|حم|عسق|ق|ن)\b/.test(text)){
      const parts=text.split(/\s+/);
      const opening=parts.shift();
      text=`<span class="opening">${opening}</span> ${parts.join(" ")}`;
   }

   html+=`<div class="ayah"><span class="ayahText">${text}</span><span class="ayahNum">${a.ayahInSurah}</span></div>`;
 });

 html+=`
  <div class="pageBottom">
   <div class="bottomBox">${data[0]?data[0].surahName:"القرآن الكريم"}</div>
   <div class="pageNumber">${currentPage+1}</div>
   <div class="bottomBox">صفحة</div>
  </div>
 </div>`;
 page.innerHTML=html;
 document.getElementById("status").textContent="صفحہ "+(currentPage+1)+" / 604";
 page.scrollTop=0;
}

function preparePages(ayahs){
 const map={};
 ayahs.forEach(a=>{
   const p=a.page||1;
   if(!map[p])map[p]=[];
   map[p].push({
     surah:a.surah.number,
     surahName:a.surah.name,
     revelationType:a.surah.revelationType,
     juz:a.juz,
     ayahInSurah:a.numberInSurah,
     text:a.text
   });
 });
 pages=Array.from({length:604},(_,i)=>map[i+1]||[]);
}

async function loadQuran(){
 try{
   const r=await fetch(API);
   if(!r.ok)throw new Error("API error");
   const j=await r.json();
   preparePages(j.data.ayahs);
   const saved=parseInt(localStorage.getItem("quranBookmark"));
   currentPage=(saved>=0&&saved<604)?saved:0;
   renderPage();
   document.getElementById("status").textContent="صفحہ "+(currentPage+1)+" / 604";
 }catch(e){
   document.getElementById("page").innerHTML=`
   <div class="error">
    قرآن پاک لوڈ نہیں ہو سکا۔<br><br>
    براہِ کرم انٹرنیٹ آن کرکے صفحہ دوبارہ کھولیں۔
   </div>`;
   document.getElementById("status").textContent="لوڈنگ میں مسئلہ";
 }
}

function searchQuran(){
 const q=cleanText(document.getElementById("searchInput").value);
 const box=document.getElementById("searchResults");
 if(!q){box.style.display="none";return}
 let results=[];
 pages.forEach((arr,p)=>{
   arr.forEach(a=>{
     if(a.text.includes(q))results.push({p,a});
   });
 });
 box.innerHTML=results.length
 ? results.slice(0,100).map(x=>`<div class="result" onclick="closeSearch();goToPage(${x.p})">
 <b>صفحہ ${x.p+1}</b> — ${x.a.surahName}، آیت ${x.a.ayahInSurah}<br>${x.a.text}
 </div>`).join("")
 : `<div class="result">یہ لفظ نہیں ملا۔</div>`;
 box.style.display="block";
}
function closeSearch(){document.getElementById("searchResults").style.display="none"}

document.getElementById("book").addEventListener("touchstart",e=>{
 touchStartX=e.changedTouches[0].screenX;
 touchStartY=e.changedTouches[0].screenY;
},{passive:true});

document.getElementById("book").addEventListener("touchend",e=>{
 const dx=e.changedTouches[0].screenX-touchStartX;
 const dy=e.changedTouches[0].screenY-touchStartY;
 if(Math.abs(dx)>70 && Math.abs(dx)>Math.abs(dy)*1.2){
   if(dx<0)nextPage();else prevPage();
 }
},{passive:true});

document.getElementById("book").addEventListener("click",e=>{
 if(e.target.closest("button,input"))return;
 const rect=document.getElementById("book").getBoundingClientRect();
 if(e.clientX-rect.left<80)prevPage();
 else if(e.clientX-rect.left>rect.width-80)nextPage();
});

document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft")nextPage();
 if(e.key==="ArrowRight")prevPage();
});

loadQuran();
</script>
</body>
</html>
