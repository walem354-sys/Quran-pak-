<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>قرآن پاک — Al Quran-ul-Kareem</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#d9cdb2;
}

body{
  font-family:"Amiri","Noto Naskh Arabic","Traditional Arabic",serif;
  color:#201d17;
}

.app{
  width:100%;
  height:100vh;
  overflow:hidden;
  position:relative;
}

/* TOP */
.top{
  height:55px;
  background:#075e54;
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
  font-family:Arial,sans-serif;
}

.title{
  font-size:18px;
  font-weight:bold;
}

.topBtns{
  display:flex;
  gap:6px;
}

.topBtns button{
  width:38px;
  height:38px;
  border:0;
  border-radius:10px;
  background:#ffffff20;
  color:white;
  font-size:19px;
}

/* SURAH SELECT */
.selectArea{
  height:46px;
  padding:4px 9px;
  background:#f3ead5;
  border-bottom:1px solid #b9a987;
}

#surahSelect{
  width:100%;
  height:38px;
  border:1px solid #a99770;
  border-radius:9px;
  background:white;
  font-size:15px;
  padding:0 9px;
}

/* BOOK */
.bookArea{
  height:calc(100vh - 101px);
  padding:7px;
  perspective:1200px;
  overflow:hidden;
}

.book{
  width:100%;
  height:100%;
  max-width:650px;
  margin:auto;
  position:relative;
  overflow:hidden;
  background:#fffdf4;
  border:2px solid #b39b68;
  border-radius:5px;
  box-shadow:0 3px 18px #0004;
  touch-action:none;
  user-select:none;
}

/* PAGE */
.page{
  width:100%;
  height:100%;
  overflow:hidden;
  background:
    radial-gradient(circle at center,#fffef8 0,#fffdf4 70%,#f3ead5 100%);
  transition:transform .42s ease,opacity .42s ease;
  transform-origin:center right;
  will-change:transform;
}

.page.turnNext{
  transform:rotateY(-90deg);
  opacity:.2;
}

.page.turnPrev{
  transform:rotateY(90deg);
  opacity:.2;
}

/* CONTENT */
.content{
  width:100%;
  height:100%;
  padding:5px 12px 8px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* SURAH BOX */
.surahBox{
  flex-shrink:0;
  margin:0 auto 5px;
  width:96%;
  border:2px solid #a78a4e;
  border-radius:12px;
  background:linear-gradient(#fbf3df,#f4e8ca);
  box-shadow:inset 0 0 0 2px #ead9b1;
  padding:3px 7px 5px;
  text-align:center;
}

.surahName{
  font-size:24px;
  font-weight:bold;
  line-height:1.15;
  color:#684f23;
}

.surahInfo{
  display:flex;
  justify-content:center;
  gap:18px;
  font-family:Arial,sans-serif;
  font-size:10px;
  color:#63553b;
  margin-top:1px;
}

.bismillah{
  margin-top:2px;
  padding-top:2px;
  border-top:1px solid #cbb98d;
  font-size:23px;
  line-height:1.25;
  color:#30291e;
}

/* AYATS */
.ayahArea{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  justify-content:space-evenly;
  overflow:hidden;
  padding:1px 5px;
}

.ayah{
  position:relative;
  direction:rtl;
  text-align:right;
  font-size:22px;
  line-height:1.48;
  padding:1px 0 3px;
  border-bottom:1px dotted #c9b98f;
  word-spacing:2px;
}

.ayah:last-child{
  border-bottom:0;
}

.ayahNumber{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:25px;
  height:25px;
  border:1px solid #9c8148;
  border-radius:50%;
  font-family:Arial,sans-serif;
  font-size:10px;
  color:#6b5325;
  margin-right:4px;
  vertical-align:middle;
}

.audioBtn{
  position:absolute;
  left:0;
  top:3px;
  width:23px;
  height:23px;
  border:0;
  border-radius:50%;
  background:#075e54;
  color:white;
  font-size:10px;
}

/* PAGE NUMBER */
.pageNumber{
  position:absolute;
  bottom:4px;
  left:50%;
  transform:translateX(-50%);
  font-family:Arial,sans-serif;
  font-size:9px;
  color:#817455;
}

/* LOADING */
.loading{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:20px;
  color:#77694e;
}

/* SEARCH */
.searchPanel{
  display:none;
  position:absolute;
  z-index:20;
  top:60px;
  left:8px;
  right:8px;
  background:white;
  border-radius:12px;
  padding:9px;
  box-shadow:0 4px 18px #0005;
  font-family:Arial,sans-serif;
}

.searchPanel input{
  width:100%;
  height:40px;
  border:1px solid #aaa;
  border-radius:8px;
  padding:0 10px;
  font-size:16px;
}

.results{
  max-height:260px;
  overflow:auto;
  margin-top:7px;
}

.result{
  padding:8px;
  border-bottom:1px solid #ddd;
  cursor:pointer;
  font-size:13px;
}

/* DARK */
.dark{
  background:#111;
  color:#eee;
}

.dark .selectArea{
  background:#202020;
  border-color:#444;
}

.dark #surahSelect{
  background:#292929;
  color:white;
  border-color:#555;
}

.dark .book{
  background:#24231e;
  border-color:#665b43;
}

.dark .page{
  background:#24231e;
}

.dark .surahBox{
  background:linear-gradient(#302b20,#29251c);
  border-color:#806d42;
}

.dark .surahName{
  color:#dfc889;
}

.dark .surahInfo{
  color:#c4b99e;
}

.dark .bismillah{
  color:#eee;
  border-color:#64583d;
}

.dark .ayah{
  border-color:#4b4538;
}

.dark .ayahNumber{
  color:#ddc78d;
}

.dark .searchPanel{
  background:#292929;
  color:white;
}

.dark .searchPanel input{
  background:#171717;
  color:white;
  border-color:#555;
}

.dark .result{
  border-color:#444;
}

/* SMALL PHONES */
@media(max-width:380px){

  .surahName{
    font-size:21px;
  }

  .bismillah{
    font-size:20px;
  }

  .ayah{
    font-size:18px;
    line-height:1.43;
  }

  .ayahNumber{
    width:22px;
    height:22px;
  }
}

/* BIG PHONES */
@media(min-width:500px){

  .ayah{
    font-size:25px;
    line-height:1.5;
  }

  .surahName{
    font-size:27px;
  }

  .bismillah{
    font-size:26px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="top">

    <div class="title">
      📖 قرآن پاک
    </div>

    <div class="topBtns">

      <button onclick="openSearch()">🔎</button>

      <button onclick="toggleDark()">🌙</button>

      <button onclick="saveBookmark()">🔖</button>

      <button onclick="playPage()">🔊</button>

    </div>

  </div>


  <div class="selectArea">

    <select id="surahSelect" onchange="goToSurah()">
      <option value="">سورۃ منتخب کریں</option>
    </select>

  </div>


  <div class="searchPanel" id="searchPanel">

    <input
      id="searchInput"
      placeholder="قرآن پاک میں لفظ تلاش کریں..."
      oninput="searchQuran()"
    >

    <div class="results" id="results"></div>

  </div>


  <div class="bookArea">

    <div class="book" id="book">

      <div class="page" id="page">

        <div class="content" id="content">

          <div class="loading">
            قرآن پاک لوڈ ہو رہا ہے...
            <br>
            براہ کرم انٹرنیٹ آن رکھیں۔
          </div>

        </div>

      </div>

    </div>

  </div>

</div>


<script>

/* ===============================
   API
================================ */

const API = "https://api.alquran.cloud/v1";

let currentPage = 1;
let currentData = null;
let audio = null;
let touchStartX = 0;
let touchStartY = 0;
let dragging = false;


/* ===============================
   SURAH NAMES
================================ */

const surahs = [
"الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف",
"الأنفال","التوبة","يونس","هود","يوسف","الرعد","إبراهيم","الحجر",
"النحل","الإسراء","الكهف","مريم","طه","الأنبياء","الحج","المؤمنون",
"النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم",
"لقمان","السجدة","الأحزاب","سبإ","فاطر","يس","الصافات","ص","الزمر",
"غافر","فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد",
"الفتح","الحجرات","ق","الذاريات","الطور","النجم","القمر","الرحمن",
"الواقعة","الحديد","المجادلة","الحشر","الممتحنة","الصف","الجمعة",
"المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة",
"المعارج","نوح","الجن","المزمل","المدثر","القيامة","الإنسان",
"المرسلات","النبأ","النازعات","عبس","التكوير","الانفطار","المطففين",
"الانشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد",
"الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة",
"الزلزلة","العادیات","القارعة","التكاثر","العصر","الهمزة","الفيل",
"قريش","الماعون","الكوثر","الكافرون","النصر","المسد","الإخلاص",
"الفلق","الناس"
];


/* ===============================
   FILL SURAH SELECT
================================ */

const select = document.getElementById("surahSelect");

surahs.forEach((name,index)=>{

  let option = document.createElement("option");

  option.value = index + 1;

  option.textContent =
    (index + 1) + " — " + name;

  select.appendChild(option);

});


/* ===============================
   LOAD PAGE
================================ */

async function loadPage(page, animation=""){

  if(page < 1) page = 1;

  if(page > 604) page = 604;

  currentPage = page;

  const pageEl =
    document.getElementById("page");

  pageEl.classList.remove(
    "turnNext",
    "turnPrev"
  );

  document.getElementById("content").innerHTML =
    `<div class="loading">
       صفحہ ${page} لوڈ ہو رہا ہے...
     </div>`;

  try{

    const response = await fetch(
      API +
      "/page/" +
      page +
      "/quran-uthmani"
    );

    const json = await response.json();

    currentData = json.data;

    renderPage(currentData);

  }catch(error){

    document.getElementById("content").innerHTML =
      `<div class="loading">
        صفحہ لوڈ نہیں ہو سکا۔
        <br>
        انٹرنیٹ چیک کریں۔
       </div>`;

  }
}


/* ===============================
   RENDER PAGE
================================ */

function renderPage(data){

  const content =
    document.getElementById("content");

  content.innerHTML = "";

  if(!data || !data.ayahs || !data.ayahs.length){

    content.innerHTML =
      `<div class="loading">
        آیات نہیں ملیں۔
       </div>`;

    return;
  }


  /*
    صفحے میں آنے والی آیات کو
    سورۃ کے حساب سے گروپ کیا جائے گا۔
  */

  let groups = {};

  data.ayahs.forEach(ayah=>{

    let s = ayah.surah.number;

    if(!groups[s]){
      groups[s] = [];
    }

    groups[s].push(ayah);

  });


  Object.keys(groups).forEach(surahNumber=>{

    const ayahs = groups[surahNumber];

    const first = ayahs[0];

    const box =
      document.createElement("div");

    box.className = "surahBox";


    const name =
      document.createElement("div");

    name.className = "surahName";

    name.textContent =
      surahs[Number(surahNumber)-1]
      || first.surah.name;


    const info =
      document.createElement("div");

    info.className = "surahInfo";

    const place =
      first.surah.revelationType === "Meccan"
      ? "مکی"
      : "مدنی";


    info.innerHTML =
      `<span>${place}</span>
       <span>آیات: ${first.surah.numberOfAyahs}</span>
       <span id="ruku-${surahNumber}">رکوع: ...</span>`;


    box.appendChild(name);

    box.appendChild(info);


    /*
      صرف سورۃ کے شروع میں Bismillah
    */

    if(first.numberInSurah === 1 &&
       Number(surahNumber) !== 9){

      const bism
