<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#0b6b50">
<title>قرآن پاک</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;padding:0;width:100%;height:100%;
 overflow:hidden;
 font-family:"Noto Naskh Arabic","Amiri","Scheherazade New",serif;
 background:#eee8d8;color:#222
}
button,select,input{font-family:inherit}

#app{
 width:100%;height:100%;
 display:flex;flex-direction:column;
 background:linear-gradient(135deg,#f5f0e2,#e8dfca);
}

header{
 height:58px;min-height:58px;
 background:#08724f;color:white;
 display:flex;align-items:center;
 justify-content:space-between;
 padding:5px 10px;
 box-shadow:0 2px 8px #0004;
 z-index:5
}

.logo{
 font-size:22px;font-weight:bold;
 white-space:nowrap
}

.topBtns{display:flex;gap:5px}
.topBtns button{
 border:0;background:#ffffff1c;color:white;
 width:40px;height:40px;border-radius:50%;
 font-size:20px
}

#surahBox{
 background:#fff;
 margin:7px 9px 3px;
 border-radius:12px;
 box-shadow:0 2px 8px #0002;
 padding:5px;
 z-index:3
}
#surahSelect{
 width:100%;
 border:0;outline:0;
 background:white;
 color:#075e43;
 font-size:18px;
 padding:7px;
 text-align:center
}

.book{
 flex:1;
 min-height:0;
 margin:5px 8px;
 position:relative;
 display:flex;
 align-items:center;
 justify-content:center;
 overflow:hidden
}

.page{
 width:100%;
 height:100%;
 max-width:650px;
 background:#fffdf5;
 border:2px solid #b99958;
 border-radius:5px;
 box-shadow:0 4px 18px #0003;
 position:relative;
 padding:8px 12px 48px;
 overflow:hidden;
 transition:transform .25s ease,opacity .25s ease
}

.page.flipNext{
 transform:translateX(-100%) rotateY(-10deg);
 opacity:.2
}
.page.flipPrev{
 transform:translateX(100%) rotateY(10deg);
 opacity:.2
}

.surahTitle{
 text-align:center;
 font-size:25px;
 font-weight:bold;
 color:#075d43;
 margin:0 0 4px;
 line-height:1.2
}

.info{
 display:flex;
 justify-content:space-between;
 align-items:center;
 font-family:Arial,sans-serif;
 font-size:12px;
 color:#555;
 direction:rtl;
 margin-bottom:4px
}

.bismillah{
 border:2px solid #b08a3d;
 border-radius:10px;
 padding:4px;
 text-align:center;
 font-size:23px;
 color:#111;
 background:#faf2d8;
 margin:2px auto 5px;
 max-width:390px
}

#ayahs{
 height:calc(100% - 100px);
 overflow:hidden;
 display:flex;
 flex-direction:column;
 justify-content:space-around;
 direction:rtl
}

.ayah{
 min-height:0;
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
 line-height:1.65;
 font-size:22px;
 color:#171717;
 padding:1px 2px;
 position:relative
}

.ayahText{
 display:inline
}

.ayahNum{
 color:#08724f;
 font-family:Arial,sans-serif;
 font-size:12px;
 white-space:nowrap;
 margin:0 4px
}

.play{
 width:28px;height:28px;
 border:1px solid #08724f;
 background:#eef8f3;
 color:#08724f;
 border-radius:50%;
 font-family:Arial,sans-serif;
 font-size:13px;
 flex:none
}

.controls{
 position:absolute;
 bottom:5px;
 left:8px;right:8px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:5px;
 direction:ltr
}

.controls button{
 border:0;
 background:#08724f;
 color:white;
 border-radius:9px;
 height:36px;
 padding:0 13px;
 font-size:14px
}

#pageNo{
 background:#f5ead0;
 color:#075d43;
 border:1px solid #b99958;
 padding:7px 13px;
 border-radius:8px;
 font-family:Arial,sans-serif;
 direction:ltr
}

.bottom{
 height:48px;
 min-height:48px;
 display:flex;
 justify-content:center;
 align-items:center;
 gap:7px;
 padding:4px 8px
}

.bottom button{
 border:0;
 background:#08724f;
 color:#fff;
 border-radius:9px;
 padding:7px 12px;
 font-size:15px
}

#searchPanel{
 position:absolute;
 top:65px;
 left:8px;right:8px;
 background:white;
 z-index:20;
 padding:10px;
 border-radius:12px;
 box-shadow:0 4px 20px #0005;
 display:none
}
#searchInput{
 width:100%;
 border:1px solid #aaa;
 border-radius:8px;
 padding:9px;
 font-size:17px;
 outline:0
}
#searchResult{
 max-height:55vh;
 overflow:auto;
 margin-top:7px;
 direction:rtl
}
.result{
 padding:8px;
 border-bottom:1px solid #ddd;
 cursor:pointer
}

#loading{
 position:absolute;
 inset:0;
 background:#fffdf5dd;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:20px;
 color:#08724f;
 z-index:10
}

.dark #app{
 background:#171a18
}
.dark .page{
 background:#202421;
 color:#eee;
 border-color:#806c3d
}
.dark .ayah{color:#f2f2f2}
.dark #surahBox,
.dark #surahSelect,
.dark #searchPanel{
 background:#252925;color:#eee
}
.dark .bismillah{background:#302b1d;color:#fff}
.dark #pageNo{background:#302b1d;color:#fff}
.dark .info{color:#bbb}

@media(max-width:420px){
 .logo{font-size:19px}
 .ayah{font-size:19px;line-height:1.55}
 .surahTitle{font-size:22px}
 .bismillah{font-size:20px}
 .controls button{padding:0 9px;font-size:13px}
}

@media(min-width:700px){
 .ayah{font-size:25px}
}
</style>
</head>

<script>

/* ==============================
   قرآن پاک — ONE FILE
   ============================== */

const API="https://api.alquran.cloud/v1";

let currentPage=1;
let currentSurah=1;
let currentAyahs=[];
let audio=null;
let audioIndex=0;

const surahNames=[
"الفاتحہ","البقرۃ","آل عمران","النساء","المائدۃ","الانعام",
"الاعراف","الانفال","التوبۃ","یونس","ھود","یوسف","الرعد",
"ابراہیم","الحجر","النحل","الاسراء","الکہف","مریم","طٰہٰ",
"الانبیاء","الحج","المؤمنون","النور","الفرقان","الشعراء",
"النمل","القصص","العنکبوت","الروم","لقمان","السجدۃ","الاحزاب",
"سبا","فاطر","یٰسٓ","الصافات","ص","الزمر","غافر","فصلت",
"الشوریٰ","الزخرف","الدخان","الجاثیۃ","الاحقاف","محمد","الفتح",
"الحجرات","ق","الذاریات","الطور","النجم","القمر","الرحمن",
"الواقعۃ","الحدید","المجادلۃ","الحشر","الممتحنۃ","الصف",
"الجمعۃ","المنافقون","التغابن","الطلاق","التحریم","الملک",
"القلم","الحاقۃ","المعارج","نوح","الجن","المزمل","المدثر",
"القیامۃ","الانسان","المرسلات","النبأ","النازعات","عبس",
"التکویر","الانفطار","المطففین","الانشقاق","البروج","الطارق",
"الاعلیٰ","الغاشیۃ","الفجر","البلد","الشمس","اللیل","الضحیٰ",
"الشرح","التین","العلق","القدر","البینۃ","الزلزال","العادیات",
"القارعۃ","التکاثر","العصر","الہمزۃ","الفیل","قریش","الماعون",
"الکوثر","الکافرون","النصر","المسد","الاخلاص","الفلق","الناس"
];

/* تقریباً page mapping */
const startPages=[
1,2,50,77,106,128,151,177,187,208,221,235,249,255,
262,267,282,293,305,312,322,332,342,350,359,367,377,385,
396,404,411,415,418,428,434,440,446,453,458,467,477,483,
489,496,499,502,507,510,513,516,518,520,523,526,528,531,
534,537,540,543,546,549,551,553,555,557,559,561,563,565,
567,569,571,573,575,577,579,581,583,585,587,589,591,593,
595,597,599,601,602,603,604
];

async function loadPage(pageNo){

 document.getElementById("loading").style.display="flex";

 try{

  const res=await fetch(
   API+"/page/"+pageNo+"/quran-uthmani"
  );

  const data=await res.json();

  if(!data.data || !data.data.ayahs){
   throw new Error("No data");
  }

  currentAyahs=data.data.ayahs;

  renderPage();

 }catch(e){

  document.getElementById("ayahs").innerHTML=
   `<div style="text-align:center;padding:30px">
   قرآن لوڈ نہیں ہو سکا۔<br>
   براہ کرم انٹرنیٹ چیک کریں۔
   </div>`;

 }finally{

  document.getElementById("loading").style.display="none";

 }

}

function renderPage(){

 const box=document.getElementById("ayahs");
 box.innerHTML="";

 if(currentAyahs.length===0)return;

 /* صفحہ پر زیادہ سے زیادہ 12 آیات */
 let list=currentAyahs.slice(0,12);

 list.forEach((a,i)=>{

  const row=document.createElement("div");
  row.className="ayah";

  row.innerHTML=`
   <button class="play"
    onclick="playAyah('${a.audio || ""}',${i})">▶</button>
   <span class="ayahNum">﴿${a.numberInSurah}﴾</span>
   <span class="ayahText">${a.text}</span>
  `;

  box.appendChild(row);

 });

 let first=currentAyahs[0];

 if(first){

  currentSurah=first.surah.number;

  document.getElementById("surahSelect").value=currentSurah;

  document.getElementById("surahTitle").innerText=
   surahNames[currentSurah-1] || first.surah.name;

  document.getElementById("pageNo").innerText=
   "صفحہ "+currentPage;

  loadSurahInfo(currentSurah);

 }

}

async function loadSurahInfo(num){

 try{

  const r=await fetch(API+"/surah/"+num);
  const d=await r.json();

  if(d.data){

   document.getElementById("ayahInfo").innerText=
    "آیات: "+d.data.numberOfAyahs;

   document.getElementById("place").innerText=
    d.data.revelationType==="Meccan" ? "مکی" : "مدنی";

  }

 }catch(e){}

}

/* سورۃ منتخب */
async function selectSurah(){

 const n=parseInt(
  document.getElementById("surahSelect").value
 );

 currentSurah=n;

 let page=startPages[n-1] || 1;

 currentPage=page;

 await loadPage(currentPage);

}

/* اگلا صفحہ */
function nextPage(){

 if(currentPage>=604)return;

 animatePage("next");

 currentPage++;

 setTimeout(()=>{
  loadPage(currentPage);
 },180);

}

/* پچھلا صفحہ */
function previousPage(){

 if(currentPage<=1)return;

 animatePage("prev");

 currentPage--;

 setTimeout(()=>{
  loadPage(currentPage);
 },180);

}

function animatePage(type){

 const p=document.getElementById("page");

 p.classList.remove("flipNext","flipPrev");

 void p.offsetWidth;

 p.classList.add(
  type==="next" ? "flipNext" : "flipPrev"
 );

 setTimeout(()=>{
  p.classList.remove("flipNext","flipPrev");
 },300);

}

/* =====================
   AUDIO
   ===================== */

function playAyah(url,index){

 stopAudio();

 audioIndex=index;

 if(!url){

  alert("اس آیت کی آڈیو دستیاب نہیں۔");
  return;

 }

 audio=new Audio(url);

 audio.play().catch(()=>{
  alert("Audio چلانے کے لیے دوبارہ Play دبائیں۔");
 });

}

function playAll(){

 stopAudio();

 if(!currentAyahs.length)return;

 audioIndex=0;

 playCurrentAudio();

}

function playCurrentAudio(){

 if(audioIndex>=currentAyahs.length){
  audio=null;
  return;
 }

 const a=currentAyahs[audioIndex];

 if(!a.audio){
  audioIndex++;
  playCurrentAudio();
  return;
 }

 audio=new Audio(a.audio);

 audio.onended=()=>{

  audioIndex++;

  if(audioIndex<currentAyahs.length){
   playCurrentAudio();
  }

 };

 audio.play().catch(()=>{});

}

function stopAudio(){

 if(audio){

  audio.pause();

  audio.currentTime=0;

  audio=null;

 }

}

/* =====================
   BOOKMARK
   ===================== */

function bookmark(){

 localStorage.setItem(
  "quranBookmark",
  JSON.stringify({
   page:currentPage,
   surah:currentSurah
  })
 );

 alert("یہ صفحہ محفوظ ہوگیا۔ 🔖");

}

function goBookmark(){

 const x=localStorage.getItem("quranBookmark");

 if(!x){

  alert("ابھی کوئی صفحہ محفوظ نہیں۔");
  return;

 }

 try{

  const b=JSON.parse(x);

  currentPage=b.page || 1;

  currentSurah=b.surah || 1;

  document.getElementById("surahSelect").value=currentSurah;

  loadPage(currentPage);

 }catch(e){}

}

/* =====================
   DARK MODE
   ===================== */

function toggleDark(){

 document.body.classList.toggle("dark");

 localStorage.setItem(
  "darkMode",
  document.body.classList.contains("dark")
 );

}

if(localStorage.getItem("darkMode")==="true"){
 document.body.classList.add("dark");
}

/* =====================
   SEARCH
   ===================== */

function toggleSearch(){

 const p=document.getElementById("searchPanel");

 p.style.display=
  p.style.display==="block" ? "none" : "block";

 if(p.style.display==="block"){
  document.getElementById("searchInput").focus();
 }

}

/*
  Search current loaded page.
  مکمل قرآن search کے لیے بعد میں offline Quran
  database بھی اسی file میں شامل کیا جا سکتا ہے۔
*/

function searchQuran(){

 const q=document.getElementById("searchInput")
  .value.trim();

 const result=document.getElementById("searchResult");

 result.innerHTML="";

 if(q.length<2)return;

 currentAyahs.forEach(a=>{

  if(a.text.includes(q)){

   const div=document.createElement("div");

   div.className="result";

   div.innerHTML=
    `آیت ${a.numberInSurah}<br>${a.text}`;

   div.onclick=()=>{

    toggleSearch();

   };

   result.appendChild(div);

  }

 });

 if(!result.innerHTML){

  result.innerHTML=
   "<div style='padding:10px'>اس صفحے پر لفظ نہیں ملا۔</div>";

 }

}

/* =====================
   SWIPE
   ===================== */

let touchStartX=0;
let touchStartY=0;

const book=document.getElementById("book");

book.addEventListener("touchstart",e=>{

 touchStartX=e.changedTouches[0].screenX;
 touchStartY=e.changedTouches[0].screenY;

},{passive:true});

book.addEventListener("touchend",e=>{

 const endX=e.changedTouches[0].screenX;
 const endY=e.changedTouches[0].screenY;

 const dx=endX-touchStartX;
 const dy=endY-touchStartY;

 if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)){

  if(dx<0){

   /* انگلی بائیں = اگلا ورق */
   nextPage();

  }else{

   /* انگلی دائیں = پچھلا ورق */
   previousPage();

  }

 }

},{passive:true});

/* keyboard */
document.addEventListener("keydown",e=>{

 if(e.key==="ArrowLeft")nextPage();

 if(e.key==="ArrowRight")previousPage();

});

/* START */
loadPage(1);

</script>

</body>
</html>
