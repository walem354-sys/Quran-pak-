<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قرآن پاک</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7f5;
  color:#222;
}

header{
  background:#075e54;
  color:white;
  text-align:center;
  padding:22px 10px;
}

header h1{margin:0;font-size:30px}
header p{margin:8px 0 0}

.container{
  max-width:700px;
  margin:auto;
  padding:15px;
}

.search{
  width:100%;
  padding:14px;
  border:1px solid #ccc;
  border-radius:12px;
  font-size:17px;
}

button{
  border:0;
  border-radius:10px;
  padding:12px 16px;
  background:#075e54;
  color:white;
  font-size:16px;
  margin-top:10px;
}

.surah{
  background:white;
  margin:10px 0;
  padding:16px;
  border-radius:14px;
  box-shadow:0 2px 8px #0001;
  cursor:pointer;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.surah-name{
  font-size:21px;
  font-weight:bold;
}

.number{
  background:#075e54;
  color:white;
  width:40px;
  height:40px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
}

#reader{
  display:none;
}

.ayah{
  background:white;
  margin:12px 0;
  padding:20px;
  border-radius:14px;
  font-size:25px;
  line-height:2.2;
  text-align:right;
  box-shadow:0 2px 7px #0001;
}

.ayah-number{
  color:#075e54;
  font-size:17px;
  margin-left:8px;
}

.loading{
  text-align:center;
  padding:30px;
  font-size:20px;
}

.dark{
  background:#121212;
  color:#eee;
}

.dark .surah,
.dark .ayah{
  background:#1f1f1f;
  color:white;
}

.dark .search{
  background:#222;
  color:white;
  border-color:#555;
}

.back{
  margin-bottom:10px;
}
</style>
</head>

<body>

<header>
  <h1>📖 قرآن پاک</h1>
  <p>قرآن مجید پڑھیں</p>
</header>

<div class="container">

  <div id="home">

    <input
      id="search"
      class="search"
      placeholder="سورت تلاش کریں..."
      oninput="searchSurah()"
    >

    <button onclick="toggleDark()">🌙 ڈارک موڈ</button>

    <div id="surahList"></div>

  </div>

  <div id="reader">

    <button class="back" onclick="goBack()">← واپس</button>

    <h2 id="surahTitle"></h2>

    <div id="ayahs"></div>

  </div>

</div>

<script>

let surahs=[];

/* تمام سورتوں کی فہرست API سے حاصل کریں */
async function loadSurahs(){

  const box=document.getElementById("surahList");

  box.innerHTML='<div class="loading">سورتیں لوڈ ہو رہی ہیں...</div>';

  try{

    const response=await fetch(
      "https://api.alquran.cloud/v1/surah"
    );

    const result=await response.json();

    surahs=result.data;

    displaySurahs(surahs);

  }catch(error){

    box.innerHTML=
      '<div class="loading">انٹرنیٹ کنکشن چیک کریں۔</div>';

  }
}


/* سورتیں دکھائیں */
function displaySurahs(list){

  const box=document.getElementById("surahList");

  box.innerHTML="";

  list.forEach(surah=>{

    const div=document.createElement("div");

    div.className="surah";

    div.innerHTML=`

      <div>
        <div class="surah-name">
          ${surah.name}
        </div>

        <small>
          ${surah.englishName}
        </small>

        <br>

        <small>
          آیات: ${surah.numberOfAyahs}
        </small>
      </div>

      <div class="number">
        ${surah.number}
      </div>

    `;

    div.onclick=()=>{
      openSurah(surah.number,surah.name);
    };

    box.appendChild(div);

  });
}


/* سورت تلاش کریں */
function searchSurah(){

  const text=
    document.getElementById("search")
    .value
    .toLowerCase();

  const result=surahs.filter(surah=>

    surah.name.includes(text) ||
    surah.englishName.toLowerCase().includes(text)

  );

  displaySurahs(result);
}


/* اصل قرآن کی سورت کھولیں */
async function openSurah(number,name){

  document.getElementById("home").style.display="none";

  document.getElementById("reader").style.display="block";

  document.getElementById("surahTitle").innerText=
    name;

  const ayahs=document.getElementById("ayahs");

  ayahs.innerHTML=
    '<div class="loading">آیات لوڈ ہو رہی ہیں...</div>';

  try{

    const response=await fetch(
      `https://api.alquran.cloud/v1/surah/${number}/quran-uthmani`
    );

    const result=await response.json();

    ayahs.innerHTML="";

    result.data.ayahs.forEach(ayah=>{

      const div=document.createElement("div");

      div.className="ayah";

      div.innerHTML=`

        <span class="ayah-number">
          ۝ ${ayah.numberInSurah}
        </span>

        ${ayah.text}

      `;

      ayahs.appendChild(div);

    });

    window.scrollTo(0,0);

  }catch(error){

    ayahs.innerHTML=
      '<div class="loading">آیات لوڈ نہیں ہو سکیں۔ انٹرنیٹ چیک کریں۔</div>';

  }

}


/* واپس */
function goBack(){

  document.getElementById("reader").style.display="none";

  document.getElementById("home").style.display="block";

  window.scrollTo(0,0);

}


/* ڈارک موڈ */
function toggleDark(){

  document.body.classList.toggle("dark");

}


/* شروع کریں */
loadSurahs();

</script>

</body>
</html>
