<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>القرآن الكريم — Al Quran Ul Kareem</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html, body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{
    background:#052a1d;
    color:#173d2d;
    font-family:"Noto Naskh Arabic","Amiri",serif;
    transition:.3s;
}

button, select, input{
    font-family:inherit;
}

/* HEADER */
.header{
    min-height:75px;
    padding:8px 15px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:linear-gradient(135deg, #07583c 0%, #0b6b48 45%, #06472f 100%);
    border-bottom:3px solid #d7b65b;
    box-shadow:0 3px 15px rgba(0,0,0,.35);
    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    width:52px;
    height:52px;
    border:2px solid #d9b85b;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#f3d875;
    font-size:30px;
    background:radial-gradient(circle,#0b6040,#06452f);
    box-shadow:0 2px 7px rgba(0,0,0,.3);
}

.headerTitle{
    text-align:center;
    flex:1;
}

.headerTitle h1{
    margin:0;
    color:#f4d77b;
    font-size:24px;
    line-height:1.1;
    font-weight:700;
}

.headerTitle div{
    color:#fff;
    font-family:Arial,sans-serif;
    font-size:11px;
    letter-spacing:2px;
    margin-top:2px;
}

.headerButtons{
    display:flex;
    gap:8px;
}

.iconBtn{
    width:40px;
    height:40px;
    border-radius:50%;
    border:1px solid #ffe39a;
    background:linear-gradient(#f6c747,#eaa91d);
    color:#fff;
    font-size:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 2px 5px rgba(0,0,0,.25);
    cursor:pointer;
}

.iconBtn:active{
    transform:scale(.93);
}

/* CONTROLS */
.controls{
    padding:10px;
    background:#07553a;
    border-bottom:2px solid #c9a84f;
    display:none;
}

.controls.show{
    display:block;
}

.controlRow{
    display:flex;
    gap:8px;
    margin-bottom:8px;
}

.controlRow:last-child{
    margin-bottom:0;
}

.searchBox, .surahSelect{
    width:100%;
    height:42px;
    border-radius:21px;
    border:2px solid #d6b75e;
    background:#fffdf0;
    color:#174c35;
    outline:none;
    padding:0 15px;
    font-size:15px;
}

.searchBtn{
    min-width:48px;
    height:42px;
    border-radius:21px;
    border:2px solid #d6b75e;
    background:#eebd39;
    color:white;
    font-size:18px;
    cursor:pointer;
}

/* MAIN CONTAINERS */
.main{
    max-width:760px;
    margin:auto;
    padding:12px 6px 30px;
}

/* BOOK & PAGE FRAME */
.book{
    width:100%;
}

.page{
    position:relative;
    width:100%;
    min-height:800px;
    padding:15px 12px 12px;
    background:#fff8dd;
    border:8px double #bd9b43;
    box-shadow:0 8px 25px rgba(0,0,0,.4), inset 0 0 0 6px #0c6344, inset 0 0 0 9px #d5b557;
    overflow:hidden;
}

/* TOP HEADER BAR */
.pageTop{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
}

.topBox{
    min-width:85px;
    padding:4px 10px;
    text-align:center;
    color:#174b35;
    background:#fff1c2;
    border:1px solid #c39f45;
    border-radius:16px;
    font-size:13px;
    font-weight:bold;
}

.pageNumber{
    background:#09603f;
    color:#f6d77b;
    border:2px solid #d8b85c;
    min-width:55px;
}

/* SURAH HEADER FRAME */
.surahHeader{
    margin:10px auto 12px;
    max-width:95%;
    padding:8px 14px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    background:linear-gradient(90deg, #07593b, #0a7049, #07593b);
    color:#f9dc82;
    border:2px solid #c9a64e;
    border-radius:8px;
    box-shadow:0 2px 5px rgba(0,0,0,.25);
}

.surahNumber{
    min-width:30px;
    height:30px;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:50%;
    background:#e1bc54;
    color:#075337;
    font-size:13px;
    font-weight:bold;
}

.surahArabic{
    font-family:"Amiri",serif;
    font-size:28px;
    font-weight:bold;
}

/* BISMILLAH */
.bismillah{
    width:85%;
    margin:8px auto 14px;
    text-align:center;
    padding:6px;
    color:#144e36;
    background:linear-gradient(#fffbe9,#f8e9b6);
    border:1px solid #b7943e;
    border-radius:20px;
    font-family:"Amiri",serif;
    font-size:24px;
    font-weight:bold;
}

/* QURAN TEXT DISPLAY */
.quranText{
    padding:8px;
    text-align:justify;
    color:#172f25;
    font-family:"Amiri",serif;
    font-size:26px;
    line-height:2.3;
    direction:rtl;
}

.ayah{
    display:inline;
}

.ayahNumber{
    display:inline-flex;
    width:28px;
    height:28px;
    margin:0 4px;
    align-items:center;
    justify-content:center;
    vertical-align:middle;
    border:1px solid #ae8d3e;
    border-radius:50%;
    color:#15543b;
    background:radial-gradient(circle,#fff6c9,#e6c866);
    font-size:13px;
    font-weight:bold;
}

/* PAGE BOTTOM & NAV */
.pageBottom{
    margin-top:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:6px;
}

.bottomBox{
    flex:1;
    min-height:34px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #bb9941;
    border-radius:17px;
    background:#fff7d7;
    color:#155139;
    font-size:12px;
    font-weight:bold;
}

.bottomCenter{
    flex:1.5;
    background:linear-gradient(#086344,#075339);
    color:#f5d87c;
    border:2px solid #caa84e;
}

.navigation{
    margin-top:10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:6px;
    background:linear-gradient(90deg, #07563a, #0a6845, #07563a);
    border:2px solid #c7a64e;
    border-radius:10px;
}

.navBtn{
    width:45px;
    height:35px;
    border:0;
    border-radius:18px;
    background:transparent;
    color:#f3d37b;
    font-size:24px;
    cursor:pointer;
}

.navCenter{
    flex:1;
    height:35px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#f4d47b;
    font-size:14px;
    font-weight:bold;
    background:#07583b;
    border:1px solid #c6a44a;
    border-radius:18px;
}

/* COVER PAGE */
.cover{
    min-height:800px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.coverInner{
    width:90%;
    padding:30px 18px;
    border:4px double #c9a74d;
    border-radius:12px;
    background:radial-gradient(circle at center, #fff4c7 0, #f4dda0 55%, #e5c875 100%);
    box-shadow:inset 0 0 0 5px #0a6241, inset 0 0 0 8px #d1af51;
}

.coverOrnament{
    width:140px;
    height:140px;
    margin:15px auto 20px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:5px solid #c7a348;
    background:radial-gradient(circle, #0a6945 0, #07543a 60%, #053d2c 100%);
    color:#f0cf6b;
    clip-path:polygon(50% 0%, 61% 14%, 76% 9%, 83% 24%, 97% 25%, 91% 40%, 100% 50%, 91% 61%, 97% 76%, 83% 77%, 76% 92%, 61% 86%, 50% 100%, 39% 86%, 24% 92%, 17% 77%, 3% 76%, 9% 61%, 0% 50%, 9% 40%, 3% 25%, 17% 24%, 24% 9%, 39% 14%);
    font-size:55px;
    font-family:"Amiri",serif;
}

.coverTitle{
    color:#07563a;
    font-family:"Amiri",serif;
    font-size:36px;
    font-weight:bold;
}

.startBtn{
    margin-top:25px;
    min-width:180px;
    padding:10px 24px;
    border:2px solid #d2b052;
    border-radius:25px;
    background:linear-gradient(#0a7049,#075238);
    color:#f7d77d;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.searchResults{
    display:none;
    max-height:50vh;
    overflow:auto;
    background:#fff8dc;
    border:2px solid #c5a34d;
    border-radius:10px;
    margin-top:8px;
}

.searchResults.show{ display:block; }

.result{
    padding:10px;
    border-bottom:1px solid #d8c27d;
    cursor:pointer;
}

body.dark{ background:#03140e; }
body.dark .page{ background:#e6d7a3; }
</style>
</head>

<body>

<header class="header">
    <div class="logo">ﷲ</div>
    <div class="headerTitle">
        <h1>القرآن الكريم</h1>
        <div>AL QURAN UL KAREEM</div>
    </div>
    <div class="headerButtons">
        <button class="iconBtn" onclick="toggleControls()" title="تلاش">🔍</button>
        <button class="iconBtn" onclick="bookmarkPage()" title="بک مارک">🔖</button>
        <button class="iconBtn" onclick="toggleDark()" title="ڈارک موڈ">☰</button>
    </div>
</header>

<section class="controls" id="controls">
    <div class="controlRow">
        <input id="searchInput" class="searchBox" type="search" placeholder="قرآن پاک میں لفظ تلاش کریں..." autocomplete="off">
        <button class="searchBtn" onclick="searchQuran()">🔍</button>
    </div>
    <div class="controlRow">
        <select id="surahSelect" class="surahSelect" onchange="selectSurah(this.value)">
            <option value="">سورت منتخب کریں</option>
        </select>
    </div>
    <div id="searchResults" class="searchResults"></div>
</section>

<main class="main">
    <div id="app"></div>
</main>
